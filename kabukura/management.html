<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マネジメントノート 2026–2036</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f5f5f3;--bg3:#efefec;
  --text:#1a1a18;--text2:#6b6b67;--text3:#a8a8a3;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.25);
  --success-bg:#eaf3de;--success-text:#27500a;
  --info-bg:#e6f1fb;--info-text:#0c447c;
  --warn-bg:#faeeda;--warn-text:#633806;
  --danger-bg:#fcebeb;--danger-text:#a32d2d;
  --r:8px;--rl:12px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1e1e1c;--bg2:#2a2a27;--bg3:#323230;
    --text:#f0f0ec;--text2:#a8a8a3;--text3:#6b6b67;
    --border:rgba(255,255,255,0.12);--border2:rgba(255,255,255,0.28);
    --success-bg:#173404;--success-text:#c0dd97;
    --info-bg:#042c53;--info-text:#85b7eb;
    --warn-bg:#412402;--warn-text:#fac775;
    --danger-bg:#501313;--danger-text:#f09595;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;padding:1.5rem 1rem}
.container{max-width:900px;margin:0 auto}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;gap:8px;flex-wrap:wrap}
.app-title{font-size:20px;font-weight:500;color:var(--text)}
.app-sub{font-size:12px;color:var(--text3);margin-top:2px}
.top-actions{display:flex;gap:6px}
.icon-btn{padding:6px 13px;font-size:12px;border-radius:var(--r);cursor:pointer;border:0.5px solid var(--border2);background:transparent;color:var(--text);display:inline-flex;align-items:center;gap:5px;transition:background .12s;font-family:inherit;white-space:nowrap}
.icon-btn:hover{background:var(--bg2)}
.icon-btn.primary{background:var(--text);color:var(--bg);border-color:transparent}
.icon-btn.primary:hover{opacity:.85;background:var(--text)}
.icon-btn svg{width:13px;height:13px;flex-shrink:0}
.nav-wrap{overflow-x:auto;margin-bottom:1.1rem;padding-bottom:3px}
.nav-wrap::-webkit-scrollbar{height:3px}
.nav-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.nav{display:flex;gap:3px;background:var(--bg2);border-radius:var(--r);padding:4px;width:max-content;min-width:100%}
.nav-wrap-analysis{margin-bottom:1.1rem;}
.nav-analysis-wrap{display:flex;flex-wrap:wrap;gap:3px;background:var(--bg2);border-radius:var(--r);padding:4px;width:100%}
.nav-analysis-wrap .tab{padding:4px 9px;font-size:11px}
.tab{padding:5px 11px;font-size:12px;border:none;background:transparent;border-radius:6px;cursor:pointer;color:var(--text2);white-space:nowrap;transition:all .15s;font-family:inherit}
.tab.active{background:var(--bg);color:var(--text);font-weight:500;border:0.5px solid var(--border)}
.tab:hover:not(.active){background:var(--bg)}
.tab.today-tab{color:var(--info-text)}
.tab.today-tab.active{color:var(--info-text);border-color:var(--info-bg)}
.tab-divider{width:0.5px;background:var(--border);margin:4px 2px;flex-shrink:0}
.panel{display:none}.panel.active{display:block}
.memo-label{font-size:11px;color:var(--text3);margin-bottom:4px}
.memo-area{width:100%;min-height:52px;resize:vertical;font-size:13px;padding:8px 11px;border:0.5px solid var(--border);border-radius:var(--rl);background:var(--bg);color:var(--text);font-family:inherit;line-height:1.6;margin-bottom:.8rem}
.memo-area:focus{outline:none;border-color:var(--border2)}
.prog-bar{height:3px;background:var(--bg2);border-radius:2px;margin:.4rem 0;overflow:hidden}
.prog-fill{height:100%;background:#3b6d11;border-radius:2px;transition:width .4s}
.prog-label{font-size:11px;color:var(--text2);text-align:right;margin-bottom:.5rem}

/* GANTT — right-cell is the positioning parent */
.right-cell{padding:0;position:relative;overflow:visible;min-width:80px}

/* gantt-area: absolutely fills the right-cell row, grid of columns */
.gantt-area{
  position:absolute;inset:0;
  display:flex;flex-direction:row;
  gap:2px;padding:0 3px;
}
/* Each column fills full height */
.gantt-col{
  flex:1;
  position:relative;
  height:100%;
  min-width:12px;
  max-width:40px;
}
/* The bar: absolute within its column, top/height in % of month */
.gantt-bar{
  position:absolute;
  left:0;right:0;
  cursor:pointer;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:filter .12s;
  min-height:3px;
}
.gantt-bar:hover{filter:brightness(0.88)}
.gantt-bar.done{opacity:.4}
/* Title inside bar — vertical text */
.gantt-bar-title{
  writing-mode:vertical-rl;
  text-orientation:mixed;
  font-size:10px;
  font-weight:600;
  color:rgba(255,255,255,0.95);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-height:100%;
  line-height:1.2;
  transform:rotate(180deg);
  padding:3px 0;
  user-select:none;
  pointer-events:none;
}

/* YEAR VIEW layout */
.year-view-wrapper{position:relative;overflow:visible}
.year-view-header{display:flex;font-size:11px;font-weight:500;color:var(--text2);border-bottom:0.5px solid var(--border2);padding-bottom:2px;align-items:center}
.yh-month{width:44px;flex-shrink:0;padding:3px 5px}
.yh-left{padding:3px 6px;overflow:hidden;min-width:60px}
.yh-right{padding:3px 6px;min-width:80px}
.col-resize-handle{width:14px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;}
.col-resize-handle::before{content:'';position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:2px;background:var(--border2);border-radius:2px;transition:background .15s}
.col-resize-handle::after{content:'⋮⋮';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;letter-spacing:-2px;color:var(--text3);background:var(--bg);border:0.5px solid var(--border2);border-radius:4px;padding:2px 3px;line-height:1;transition:all .15s}
.col-resize-handle:hover::before,.col-resize-handle.dragging::before{background:var(--info-text)}
.col-resize-handle:hover::after,.col-resize-handle.dragging::after{color:var(--info-text);border-color:var(--info-text);background:var(--info-bg)}
.year-view{display:flex;flex-direction:column;overflow:visible}
.month-row{display:flex;border-top:0.5px solid var(--border);overflow:visible;position:relative;}
.row-resize-handle{position:absolute;top:0;left:0;right:0;height:6px;cursor:row-resize;z-index:10;background:transparent;}
.row-resize-handle:hover{background:linear-gradient(to bottom,rgba(14,99,200,0.35) 1.5px,transparent 1.5px);}
.month-row.current-month-row{background:rgba(14,99,200,0.03)}
.month-label-cell{width:44px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 4px 4px;gap:1px}
.month-num{font-size:15px;font-weight:600;color:var(--text3);line-height:1}
.month-unit{font-size:9px;color:var(--text3)}
.month-num.current{color:var(--info-text)}
.month-unit.current{color:var(--info-text)}
.today-pip{width:5px;height:5px;border-radius:50%;background:var(--info-text);margin-top:2px}
.left-cell{border-left:0.5px solid var(--border);padding:4px 6px;display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:60px}
.row-resize-spacer{width:14px;flex-shrink:0}

/* Chips */
.single-chip{display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:var(--r);background:var(--bg);border:0.5px solid var(--border);cursor:default;flex-wrap:nowrap;min-height:22px}
.single-chip:hover{border-color:var(--border2)}
.single-chip.done{opacity:.4}.single-chip.done .chip-title{text-decoration:line-through}
.chip-check{width:13px;height:13px;border-radius:50%;border:1.2px solid var(--border2);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chip-check.done{background:var(--success-bg);border-color:var(--success-text)}
.chip-check svg{display:none;width:7px;height:7px}.chip-check.done svg{display:block}
.chip-day{font-size:10px;font-weight:600;color:var(--text2);white-space:nowrap;flex-shrink:0}
.chip-badge{font-size:9px;padding:1px 5px;border-radius:20px;font-weight:500;white-space:nowrap;flex-shrink:0}
.chip-badge.ok{background:var(--info-bg);color:var(--info-text)}
.chip-badge.urgent{background:var(--warn-bg);color:var(--warn-text)}
.chip-badge.overdue{background:var(--danger-bg);color:var(--danger-text)}
.chip-title{font-size:11px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.chip-cat{font-size:9px;padding:1px 4px;border-radius:20px;font-weight:500;flex-shrink:0;white-space:nowrap}
.chip-actions{display:flex;gap:1px;flex-shrink:0;opacity:0;transition:opacity .15s}
.single-chip:hover .chip-actions{opacity:1}
.chip-act{font-size:9px;border:none;background:transparent;cursor:pointer;color:var(--text3);padding:1px 3px;border-radius:3px;display:flex;align-items:center;font-family:inherit}
.chip-act:hover{background:var(--bg2);color:var(--text)}
.chip-act.del:hover{color:var(--danger-text);background:var(--danger-bg)}
.no-date-section{margin-top:.7rem}
.no-date-label{font-size:11px;color:var(--text3);margin-bottom:4px;font-weight:500}
.done-hdr{display:flex;align-items:center;gap:6px;margin:.7rem 0 4px}
.done-lbl{font-size:12px;font-weight:500;color:var(--text2)}
.done-bdg{font-size:10px;padding:1px 7px;border-radius:20px;background:var(--success-bg);color:var(--success-text);font-weight:500}
.empty{text-align:center;padding:2rem 1rem;color:var(--text3);font-size:13px;line-height:2.2}

/* TODAY */
.today-header{background:var(--info-bg);border-radius:var(--rl);padding:.75rem 1rem;margin-bottom:.9rem;display:flex;align-items:center;justify-content:space-between}
.today-date-text{font-size:13px;font-weight:500;color:var(--info-text)}
.today-count{font-size:11px;color:var(--info-text);opacity:.8}
.today-memo-wrap{margin-bottom:.9rem}
.today-memo-label{font-size:11px;color:var(--text3);margin-bottom:4px}
.today-memo{width:100%;min-height:50px;resize:vertical;font-size:13px;padding:8px 11px;border:0.5px solid var(--border);border-radius:var(--rl);background:var(--bg);color:var(--text);font-family:inherit;line-height:1.6}
.today-memo:focus{outline:none;border-color:var(--border2)}
.today-section-label{font-size:11px;font-weight:500;color:var(--text2);margin:1rem 0 5px;display:flex;align-items:center;gap:6px}
.today-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.t-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:.6rem .9rem;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.t-card:hover{border-color:var(--border2)}
.t-card.done{opacity:.4}.t-card.done .t-title{text-decoration:line-through}
.t-check{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.t-check.done{background:var(--success-bg);border-color:var(--success-text)}
.t-check svg{display:none;width:8px;height:8px}.t-check.done svg{display:block}
.t-body{flex:1;min-width:0}
.t-title{font-size:13px;font-weight:500;color:var(--text)}
.t-meta{display:flex;align-items:center;gap:5px;margin-top:2px;flex-wrap:wrap}
.t-date{font-size:11px;color:var(--text2)}
.t-badge{font-size:10px;padding:1px 6px;border-radius:20px;font-weight:500}
.t-badge.ok{background:var(--info-bg);color:var(--info-text)}
.t-badge.urgent{background:var(--warn-bg);color:var(--warn-text)}
.t-badge.overdue{background:var(--danger-bg);color:var(--danger-text)}
.t-cat{font-size:10px;padding:1px 6px;border-radius:20px;font-weight:500}
.t-actions{display:flex;gap:2px;flex-shrink:0}
.t-act{font-size:11px;border:none;background:transparent;cursor:pointer;color:var(--text3);padding:3px 4px;border-radius:3px;display:flex;align-items:center;font-family:inherit}
.t-act:hover{background:var(--bg2);color:var(--text)}
.t-act.del:hover{color:var(--danger-text);background:var(--danger-bg)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.stat{background:var(--bg2);border-radius:var(--r);padding:.65rem .8rem;text-align:center}
.stat-num{font-size:19px;font-weight:500;color:var(--text)}
.stat-label{font-size:11px;color:var(--text2);margin-top:2px}
.sec-label{font-size:12px;font-weight:500;color:var(--text2);margin:1rem 0 7px}
.ybr{margin-bottom:8px}
.ybr-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.ybr-top span:first-child{font-weight:500;color:var(--text)}
.ybr-top span:last-child{color:var(--text2)}
.dl-section{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:.9rem 1rem;margin-bottom:.9rem}
.dl-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:9px}
.dl-btns{display:flex;gap:7px;flex-wrap:wrap}
.notice{font-size:11px;color:var(--text3);margin-top:7px}
#import-msg{font-size:12px;margin-top:6px;display:block;min-height:15px}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:flex-start;justify-content:center;padding:1rem;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:1.25rem;width:100%;max-width:500px;position:relative;margin:auto}
.modal-title{font-size:14px;font-weight:500;color:var(--text);margin-bottom:1rem}
.modal-close{position:absolute;top:10px;right:12px;font-size:18px;border:none;background:transparent;cursor:pointer;color:var(--text3);font-family:inherit}
.modal-close:hover{color:var(--text)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.fr.full{grid-template-columns:1fr}
.fr.three{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;margin-bottom:8px;align-items:end}
.fr-arrow{font-size:14px;color:var(--text3);padding-bottom:9px;text-align:center}
.fg label{display:block;font-size:11px;color:var(--text2);margin-bottom:3px}
.fg input[type=text],.fg select{width:100%;padding:7px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;outline:none}
.fg input:focus,.fg select:focus{border-color:var(--text)}
.cat-custom-wrap{margin-top:5px}
.cat-custom-wrap input{width:100%;padding:6px 10px;font-size:12px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;outline:none}
.modal-actions{display:flex;gap:8px;margin-top:12px}
.section-divider{border:none;border-top:0.5px solid var(--border);margin:10px 0}
.date-mode-tabs{display:flex;gap:4px;margin-bottom:8px}
.dmode-btn{padding:4px 12px;font-size:11px;border:0.5px solid var(--border2);border-radius:20px;cursor:pointer;background:transparent;color:var(--text2);transition:all .12s;font-family:inherit}
.dmode-btn:hover{background:var(--bg2)}
.dmode-btn.active{background:var(--text);color:var(--bg);border-color:transparent;font-weight:500}
.date-picker-wrap{position:relative}
.date-display{width:100%;padding:7px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px;font-family:inherit}
.date-display:hover{border-color:var(--text2)}
.date-display svg{width:12px;height:12px;flex-shrink:0;color:var(--text3)}
.date-display.placeholder{color:var(--text3)}
.cal-popup{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:200;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--rl);padding:10px;min-width:260px;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
.cal-popup.open{display:block}
.cal-year-strip{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px;padding-bottom:8px;border-bottom:0.5px solid var(--border)}
.yr-btn{padding:3px 8px;font-size:11px;border:0.5px solid var(--border);border-radius:20px;cursor:pointer;background:transparent;color:var(--text2);transition:all .12s;font-family:inherit}
.yr-btn:hover{background:var(--bg2)}
.yr-btn.active{background:var(--text);color:var(--bg);border-color:transparent;font-weight:500}
.cal-month-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-month-label span{font-size:12px;font-weight:500;color:var(--text)}
.cal-nav{background:transparent;border:none;cursor:pointer;color:var(--text2);padding:2px 6px;border-radius:4px;font-size:16px;line-height:1;font-family:inherit}
.cal-nav:hover{background:var(--bg2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
.cal-dow{font-size:9px;color:var(--text3);padding:2px 0;font-weight:500}
.cal-dow.sun{color:#c0392b}.cal-dow.sat{color:#2980b9}
.cal-day{font-size:11px;padding:4px 0;border-radius:5px;cursor:pointer;color:var(--text);border:none;background:transparent;width:100%;font-family:inherit}
.cal-day:hover:not(:disabled){background:var(--bg2)}
.cal-day.today-cal{font-weight:500;color:var(--info-text)}
.cal-day.selected{background:var(--text);color:var(--bg)!important;font-weight:500}
.cal-day.other-month{color:var(--text3)}
.cal-day.sun-col{color:#c0392b}.cal-day.sat-col{color:#2980b9}
.cal-day:disabled{opacity:.3;cursor:default}
.cal-clear{margin-top:6px;padding-top:6px;border-top:0.5px solid var(--border)}
.cal-clear button{font-size:11px;padding:2px 8px;border:0.5px solid var(--border2);border-radius:var(--r);background:transparent;cursor:pointer;color:var(--text2);font-family:inherit}
.cal-clear button:hover{background:var(--bg2)}

/* ── ワークスペースタブ ── */
.ws-bar{display:flex;gap:0;margin-bottom:0;border-bottom:2px solid var(--border2);}
.ws-tab{padding:10px 22px;font-size:13px;font-weight:500;border:none;background:transparent;
  color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;
  font-family:inherit;transition:all .15s;white-space:nowrap;letter-spacing:0.01em;}
.ws-tab:hover{color:var(--text);background:var(--bg2);}
.ws-tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:600;}
.ws-tab.ws-time.active{color:#0c447c;border-bottom-color:#0c447c;}
.ws-tab.ws-dream.active{color:#3b6d11;border-bottom-color:#3b6d11;}
.ws-tab.ws-stock.active{color:#633806;border-bottom-color:#633806;}
.ws-tab.ws-imaget.active{color:#1a5276;border-bottom-color:#1a5276;}
.ws-tab.ws-position.active{color:#6d1a76;border-bottom-color:#6d1a76;}
.ws-tab.ws-analysis.active{color:#b45309;border-bottom-color:#b45309;}
/* イメトレカード */
.it-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:.75rem .9rem;margin-bottom:8px;cursor:pointer;transition:border-color .12s}
.it-card:hover{border-color:var(--border2)}
.it-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:6px}
.it-event-badge{font-size:11px;font-weight:600;background:var(--info-bg);color:var(--info-text);padding:2px 8px;border-radius:20px;white-space:nowrap}
.it-stock-name{font-size:13px;font-weight:700;color:var(--text)}
.it-stock-code{font-size:10px;color:var(--text3);background:var(--bg2);padding:1px 5px;border-radius:4px}
.it-date-badge{font-size:10px;color:var(--text3);white-space:nowrap}
.it-row{display:flex;gap:8px;margin-top:4px;align-items:baseline}
.it-label{font-size:10px;font-weight:600;color:var(--text3);white-space:nowrap;flex-shrink:0;min-width:60px}
.it-val{font-size:12px;color:var(--text2);line-height:1.5}
.it-miss{color:var(--danger-text)}
.it-lesson{color:#27500a;font-style:italic}
.ws-content{display:none;}.ws-content.active{display:block;}
.ws-header-label{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;
  color:var(--text3);margin-bottom:1rem;padding:4px 0;border-bottom:0.5px solid var(--border);}

/* 複数メモ */
.multi-memo-wrap{margin-bottom:.9rem}
.memo-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:.75rem .9rem;margin-bottom:8px;position:relative}
.memo-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.memo-card-label{font-size:11px;color:var(--text3);font-weight:500}
.memo-card-del{background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:14px;padding:0 2px;line-height:1;border-radius:3px}
.memo-card-del:hover{color:var(--danger-text);background:var(--danger-bg)}
.memo-card textarea{width:100%;min-height:52px;resize:vertical;font-size:13px;padding:7px 10px;border:0.5px solid var(--border);border-radius:var(--r);background:var(--bg2);color:var(--text);font-family:inherit;line-height:1.6}
.memo-card textarea:focus{outline:none;border-color:var(--border2)}
.add-memo-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);background:transparent;border:0.5px dashed var(--border2);border-radius:var(--r);padding:5px 12px;cursor:pointer;transition:all .15s;font-family:inherit;margin-bottom:.9rem}
.add-memo-btn:hover{color:var(--text);border-color:var(--border2);background:var(--bg2)}

/* ログイン画面 */
#loading-screen{display:flex;align-items:center;justify-content:center;min-height:80vh;font-size:14px;color:var(--text2);}
#login-screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:1.5rem;}
.login-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:2.5rem 2rem;text-align:center;max-width:360px;width:100%;}
.login-title{font-size:20px;font-weight:500;margin-bottom:.4rem;}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:2rem;}
.google-btn{display:inline-flex;align-items:center;gap:10px;padding:10px 20px;font-size:14px;border:1px solid var(--border2);border-radius:var(--r);cursor:pointer;background:var(--bg);color:var(--text);font-family:inherit;transition:background .15s;width:100%;justify-content:center;}
.google-btn:hover{background:var(--bg2);}
.user-info{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);}
.user-avatar{width:24px;height:24px;border-radius:50%;}
.save-status{font-size:11px;color:var(--text3);margin-left:4px;}
#app{display:none;}
</style>
</head>
<body>

<!-- ローディング -->
<div id="loading-screen" class="container">読み込み中...</div>

<!-- ログイン画面 -->
<div id="login-screen" class="container">
  <div class="login-card">
    <div class="login-title">マネジメントノート</div>
    <div class="login-sub">2026 — 2036<br><br>Googleアカウントでサインインして<br>データをクラウドに保存しましょう</div>
    <button class="google-btn" onclick="signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A353" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/><path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/><path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/></svg>
      Googleでサインイン
    </button>
  </div>
</div>

<!-- メインアプリ -->
<div id="app">
<div class="container">
  <!-- ワークスペースタブ -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;gap:8px;flex-wrap:wrap">
    <div><div class="app-title">マネジメントノート</div><div class="app-sub">2026 — 2036</div></div>
    <div class="user-info">
      <img id="user-avatar" class="user-avatar" src="" style="display:none">
      <span id="user-name"></span>
      <span class="save-status" id="save-status"></span>
      <button class="icon-btn" onclick="doSignOut()" style="font-size:11px;padding:4px 10px">サインアウト</button>
    </div>
  </div>
  <div class="ws-bar">
    <button class="ws-tab ws-time active" onclick="switchWS('time')">⏱ タイムマネジメント</button>
    <button class="ws-tab ws-dream" onclick="switchWS('dream')">🌟 ドリームマネジメント</button>
    <button class="ws-tab ws-stock" onclick="switchWS('stock')">📈 株式投資</button>
    <button class="ws-tab ws-analysis" onclick="switchWS('analysis')">🔬 銘柄分析</button>
    <button class="ws-tab ws-position" onclick="switchWS('position')">💼 株ポジション</button>
    <button class="ws-tab ws-imaget" onclick="switchWS('imaget')">🧠 株イメトレ</button>
  </div>

  <!-- タイムマネジメント -->
  <div class="ws-content active" id="ws-time" style="padding-top:1.2rem">
    <div class="top-bar" style="margin-bottom:1rem">
      <div class="ws-header-label">⏱ タイムマネジメント</div>
      <div class="top-actions">
        <button class="icon-btn primary" onclick="openModal()"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 2v10M2 7h10"/></svg>追加</button>
        <button class="icon-btn" onclick="setTab('保存読込')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 2v7M4.5 6.5L7 9l2.5-2.5M2 10.5v.5a1 1 0 001 1h8a1 1 0 001-1v-.5"/></svg>保存/読込</button>
      </div>
    </div>
    <div class="nav-wrap"><div class="nav" id="nav-time"></div></div>
    <div id="panels-time"></div>
  </div>

  <!-- ドリームマネジメント -->
  <div class="ws-content" id="ws-dream" style="padding-top:1.2rem">
    <div class="top-bar" style="margin-bottom:1rem">
      <div class="ws-header-label">🌟 ドリームマネジメント</div>
      <div class="top-actions">
        <button class="icon-btn primary" onclick="openModal()"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 2v10M2 7h10"/></svg>追加</button>
        <button class="icon-btn" onclick="setTab('保存読込')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 2v7M4.5 6.5L7 9l2.5-2.5M2 10.5v.5a1 1 0 001 1h8a1 1 0 001-1v-.5"/></svg>保存/読込</button>
      </div>
    </div>
    <div class="nav-wrap"><div class="nav" id="nav-dream"></div></div>
    <div id="panels-dream"></div>
  </div>

  <!-- 株式投資 -->
  <div class="ws-content" id="ws-stock" style="padding-top:1.2rem">
    <div class="top-bar" style="margin-bottom:1rem">
      <div class="ws-header-label">📈 株式投資</div>
      <div class="top-actions">
        <button class="icon-btn primary" onclick="openModal()"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 2v10M2 7h10"/></svg>追加</button>
        <button class="icon-btn" onclick="setTab('保存読込')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 2v7M4.5 6.5L7 9l2.5-2.5M2 10.5v.5a1 1 0 001 1h8a1 1 0 001-1v-.5"/></svg>保存/読込</button>
      </div>
    </div>
    <div class="nav-wrap"><div class="nav" id="nav-stock"></div></div>
    <div id="panels-stock"></div>
  </div>

  <!-- 株イメトレ -->
  <div class="ws-content" id="ws-imaget" style="padding-top:1.2rem">
    <div class="top-bar" style="margin-bottom:1rem">
      <div class="ws-header-label">🧠 株イメトレ</div>
      <div class="top-actions">
        <button class="icon-btn primary" onclick="openImagetModal()"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 2v10M2 7h10"/></svg>追加</button>
      </div>
    </div>
    <div class="nav-wrap"><div class="nav" id="nav-imaget"></div></div>
    <div id="panels-imaget"></div>
  </div>

  <!-- 株ポジション -->
  <div class="ws-content" id="ws-position" style="padding-top:1.2rem">
    <div class="top-bar" style="margin-bottom:1rem">
      <div class="ws-header-label">💼 株ポジション</div>
      <div class="top-actions">
        <button class="icon-btn primary" onclick="openPosModal()"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 2v10M2 7h10"/></svg>追加</button>
      </div>
    </div>
    <div class="nav-wrap"><div class="nav" id="nav-pos"></div></div>
    <div id="panels-pos"></div>
  </div>

  <!-- 銘柄分析 -->
  <div class="ws-content" id="ws-analysis" style="padding-top:1.2rem">
    <div class="top-bar" style="margin-bottom:1rem">
      <div class="ws-header-label">🔬 銘柄分析</div>
      <div class="top-actions">
        <button class="icon-btn primary" onclick="openAnalysisModal()"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 2v10M2 7h10"/></svg>追加 / 編集</button>
      </div>
    </div>
    <div class="nav-wrap-analysis">
      <div class="nav-analysis-wrap" id="nav-analysis"></div>
    </div>
    <div id="panels-analysis"></div>
  </div>
</div>
</div><!-- /app -->

<!-- 株ポジション専用モーダル -->
<div class="modal-overlay" id="pos-modal-overlay" onclick="if(event.target===this)closePosModal()">
  <div class="modal" style="max-width:560px">
    <button class="modal-close" onclick="closePosModal()">×</button>
    <div class="modal-title" id="pos-modal-title">ポジションを追加</div>

    <!-- ① マクロイベント -->
    <div class="fr full"><div class="fg">
      <label>① マクロイベント・出来事 *</label>
      <input type="text" id="pos-macro" placeholder="例：イラン情勢の緊張、米利上げ、AI普及加速">
    </div></div>

    <!-- ② 投資テーマ・根拠 -->
    <div class="fr full"><div class="fg">
      <label>② 投資テーマ・根拠</label>
      <textarea id="pos-theme" rows="2" placeholder="例：再エネ・蓄電池需要の高まり → エネルギー安保の重要性が増す" style="width:100%;padding:7px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;outline:none;resize:vertical;line-height:1.6"></textarea>
    </div></div>

    <!-- ③ 銘柄 -->
    <div class="fr">
      <div class="fg"><label>③ 銘柄名 *</label><input type="text" id="pos-stock" placeholder="例：パワーエックス"></div>
      <div class="fg"><label>銘柄コード</label><input type="text" id="pos-code" placeholder="例：9195"></div>
    </div>
    <div style="margin-bottom:8px">
      <div style="font-size:11px;color:var(--text2);margin-bottom:5px">判断の方向</div>
      <div style="display:flex;gap:6px">
        <button class="dmode-btn active" id="pos-dir-long" onclick="setPosDir('long')">📈 買い</button>
        <button class="dmode-btn" id="pos-dir-short" onclick="setPosDir('short')">📉 売却</button>
      </div>
    </div>
    <div class="fr">
      <div class="fg"><label>株数</label><input type="number" id="pos-qty" placeholder="例：100" style="width:100%;padding:7px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;outline:none"></div>
      <div class="fg"></div>
    </div>
    <hr class="section-divider">

    <!-- ④ 気づけたはずのタイミング -->
    <div class="fr">
      <div class="fg"><label>④ 気づけたはずのタイミング</label>
        <div class="date-picker-wrap">
          <button type="button" class="date-display placeholder" id="pos-notice-disp" onclick="togglePosCal('notice')">
            <span id="pos-notice-txt">日付を選択...</span>
            <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2.5" width="10" height="9.5" rx="1.5"/><path d="M5 1v3M9 1v3M2 6h10"/></svg>
          </button>
          <div class="cal-popup" id="pos-notice-cal">
            <div class="cal-year-strip" id="pos-notice-yr"></div>
            <div class="cal-month-label">
              <button class="cal-nav" onclick="posCalNav('notice',-1)">‹</button>
              <span id="pos-notice-lbl"></span>
              <button class="cal-nav" onclick="posCalNav('notice',1)">›</button>
            </div>
            <div class="cal-grid" id="pos-notice-grid"></div>
            <div class="cal-clear"><button onclick="clearPosCal('notice')">消去</button></div>
          </div>
        </div>
        <input type="hidden" id="pos-date-notice">
      </div>
    </div>

    <!-- 価格 -->
    <div class="fr">
      <div class="fg">
        <label>仮想購入価格（円）</label>
        <input type="number" id="pos-price-buy" placeholder="例：1200" oninput="updatePosPnl()" style="width:100%;padding:7px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;outline:none;margin-bottom:4px">
        <div class="date-picker-wrap">
          <button type="button" class="date-display placeholder" id="pos-buy-disp" onclick="togglePosCal('buy')" style="font-size:12px;padding:5px 9px">
            <span id="pos-buy-txt">購入日を選択...</span>
            <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2.5" width="10" height="9.5" rx="1.5"/><path d="M5 1v3M9 1v3M2 6h10"/></svg>
          </button>
          <div class="cal-popup" id="pos-buy-cal">
            <div class="cal-year-strip" id="pos-buy-yr"></div>
            <div class="cal-month-label">
              <button class="cal-nav" onclick="posCalNav('buy',-1)">‹</button>
              <span id="pos-buy-lbl"></span>
              <button class="cal-nav" onclick="posCalNav('buy',1)">›</button>
            </div>
            <div class="cal-grid" id="pos-buy-grid"></div>
            <div class="cal-clear"><button onclick="clearPosCal('buy')">消去</button></div>
          </div>
        </div>
        <input type="hidden" id="pos-date-buy">
      </div>
      <div class="fg">
        <label>仮想売却価格（円）</label>
        <input type="number" id="pos-price-sell" placeholder="例：1850" oninput="updatePosPnl()" style="width:100%;padding:7px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;outline:none;margin-bottom:4px">
        <div class="date-picker-wrap">
          <button type="button" class="date-display placeholder" id="pos-sell-disp" onclick="togglePosCal('sell')" style="font-size:12px;padding:5px 9px">
            <span id="pos-sell-txt">売却日を選択...</span>
            <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2.5" width="10" height="9.5" rx="1.5"/><path d="M5 1v3M9 1v3M2 6h10"/></svg>
          </button>
          <div class="cal-popup" id="pos-sell-cal">
            <div class="cal-year-strip" id="pos-sell-yr"></div>
            <div class="cal-month-label">
              <button class="cal-nav" onclick="posCalNav('sell',-1)">‹</button>
              <span id="pos-sell-lbl"></span>
              <button class="cal-nav" onclick="posCalNav('sell',1)">›</button>
            </div>
            <div class="cal-grid" id="pos-sell-grid"></div>
            <div class="cal-clear"><button onclick="clearPosCal('sell')">消去</button></div>
          </div>
        </div>
        <input type="hidden" id="pos-date-sell">
      </div>
    </div>
    <div id="pos-pnl-disp" style="font-size:12px;font-weight:500;min-height:18px;margin-bottom:4px"></div>

    <!-- ⑤ なぜ気づけなかったか -->
    <div class="fr full"><div class="fg">
      <label>⑤ なぜ気づけなかったか・何を見落としていたか</label>
      <textarea id="pos-miss" rows="2" placeholder="例：地政学リスクを軽視していた。短期の株価しか見ていなかった" style="width:100%;padding:7px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;outline:none;resize:vertical;line-height:1.6"></textarea>
    </div></div>

    <!-- ⑥ 教訓 -->
    <div class="fr full"><div class="fg">
      <label>⑥ 教訓・次に活かすこと</label>
      <textarea id="pos-lesson" rows="2" placeholder="例：マクロイベントから産業変化を読み、3〜6ヶ月先の銘柄を先回りする" style="width:100%;padding:7px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;outline:none;resize:vertical;line-height:1.6"></textarea>
    </div></div>

    <div class="modal-actions" style="flex-wrap:wrap;gap:6px">
      <button class="icon-btn primary" id="pos-save-btn" onclick="savePosItem()">追加する</button>
      <button class="icon-btn" onclick="closePosModal()">キャンセル</button>
      <button class="icon-btn" id="pos-delete-btn" onclick="posDeleteFromModal()" style="display:none;margin-left:auto;color:var(--danger-text);border-color:var(--danger-text)">🗑 削除</button>
    </div>
  </div>
</div>

<!-- 銘柄分析モーダル -->
<div class="modal-overlay" id="analysis-modal-overlay" onclick="if(event.target===this)closeAnalysisModal()">
  <div class="modal" style="max-width:600px;max-height:90vh;overflow-y:auto">
    <button class="modal-close" onclick="closeAnalysisModal()">×</button>
    <div class="modal-title" id="analysis-modal-title">銘柄分析を入力</div>

    <!-- 銘柄基本情報 -->
    <div class="fr">
      <div class="fg"><label>銘柄名 *</label><input type="text" id="an-name" placeholder="例：犬猫生活" style="width:100%;padding:7px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;outline:none"></div>
      <div class="fg"><label>銘柄コード</label><input type="text" id="an-code" placeholder="例：4328" style="width:100%;padding:7px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;outline:none"></div>
    </div>
    <div class="fr">
      <div class="fg"><label>市場</label><input type="text" id="an-market" placeholder="例：東証グロース" style="width:100%;padding:7px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;outline:none"></div>
      <div class="fg"><label>セクター / 業種</label><input type="text" id="an-sector" placeholder="例：ペット、サブスク" style="width:100%;padding:7px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;outline:none"></div>
    </div>

    <hr class="section-divider">

    <!-- 事業概要 -->
    <div class="fr full"><div class="fg">
      <label>事業概要</label>
      <textarea id="an-biz" rows="2" placeholder="例：ペットフードのサブスクリプションサービス。月額制で定期配送" style="width:100%;padding:7px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;outline:none;resize:vertical;line-height:1.6"></textarea>
    </div></div>

    <!-- 市場規模 -->
    <div class="fr full"><div class="fg">
      <label>市場規模（TAM / SAM / SOM）</label>
      <textarea id="an-tam" rows="2" placeholder="例：TAM：国内ペット市場1.6兆円　SAM：ペットフード市場5000億円　SOM：サブスク移行層200億円" style="width:100%;padding:7px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;outline:none;resize:vertical;line-height:1.6"></textarea>
    </div></div>

    <hr class="section-divider">

    <!-- 売上実績 -->
    <div style="font-size:11px;color:var(--text2);margin-bottom:6px;font-weight:500">売上実績（年別）</div>
    <div id="an-sales-rows"></div>
    <button class="add-memo-btn" onclick="addAnRow('sales')">＋ 年を追加</button>

    <!-- 将来売上予想 -->
    <div style="font-size:11px;color:var(--text2);margin-bottom:6px;font-weight:500;margin-top:8px">将来売上予想（年別）</div>
    <div id="an-forecast-rows"></div>
    <button class="add-memo-btn" onclick="addAnRow('forecast')">＋ 年を追加</button>

    <hr class="section-divider">

    <!-- 強み・競合・リスク・判断 -->
    <div class="fr full"><div class="fg">
      <label>強み・差別化ポイント</label>
      <textarea id="an-strength" rows="2" placeholder="例：独自配合フード、継続率90%超、データ蓄積による提案精度" style="width:100%;padding:7px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;outline:none;resize:vertical;line-height:1.6"></textarea>
    </div></div>

<script>
const YEARS=['2026','2027','2028','2029','2030','2031','2032','2033','2034','2035','2036'];

// ── ワークスペース管理 ──
const WS_LIST=[
  {id:'time',   label:'タイムマネジメント', key:'bl_v13_time'},

  {id:'imaget', label:'株イメトレ',          key:'bl_v13_imaget'},
];
let currentWS='time'; // アクティブなワークスペース

function switchWS(wsId){
  currentWS=wsId;
  // タブの見た目
  document.querySelectorAll('.ws-tab').forEach(b=>b.classList.remove('active'));
  document.querySelector('.ws-tab.ws-'+wsId).classList.add('active');
  // コンテンツ切替
  document.querySelectorAll('.ws-content').forEach(d=>d.classList.remove('active'));
  document.getElementById('ws-'+wsId).classList.add('active');
  // 切り替え先のWSのデータをlocalStorageからロードして描画
  // (WS_STATEはdefinePropertyでcurrentWSを自動参照するため、currentWSを先に設定)
  loadData();
  buildNav();
  buildPanels();
  rerender();
}

function storageKey(){return WS_LIST.find(w=>w.id===currentWS).key;}

const BASE_CATS=['プロジェクト①','プロジェクト②','プロジェクト③','プロジェクト④','プロジェクト⑤','プロジェクト⑥','プロジェクト⑦','健康','資格','学び','旅行','人間関係','家族'];
const STOCK_CATS=['経済','セクター','銘柄','決算','配当/優待'];
const CAT_PALETTE=[
  {bg:'#E6F1FB',color:'#0C447C',bar:'#6baed6'},{bg:'#EEEDFE',color:'#3C3489',bar:'#9e8fd4'},
  {bg:'#EAF3DE',color:'#27500A',bar:'#74c476'},{bg:'#E1F5EE',color:'#085041',bar:'#41ae76'},
  {bg:'#FBEAF0',color:'#72243E',bar:'#df65b0'},{bg:'#FAEEDA',color:'#633806',bar:'#fd8d3c'},

  {bg:'#EAF3DE',color:'#3B6D11',bar:'#78c679'},{bg:'#FAEEDA',color:'#854F0B',bar:'#fe9929'},

const MONTHS_JP=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const DOW_JP=['日','月','火','水','木','金','土'];
const WDAYS=['日','月','火','水','木','金','土'];

// ── WSごとの独立した状態 ──
const WS_STATE={};
WS_LIST.forEach(function(w){
  const defaultTab=w.id==='imaget'?'2024':'today';
  WS_STATE[w.id]={items:[],memos:{},customCats:[],currentTab:defaultTab,leftFlex:1,rightFlex:1.8,macroFlex:1,microFlex:1,rowHeight:64};
});
// アクティブWSへのアクセサ
function st(){return WS_STATE[currentWS];}
Object.defineProperty(window,'items',     {get:function(){return st().items;},     set:function(v){st().items=v;},     configurable:true});
Object.defineProperty(window,'memos',     {get:function(){return st().memos;},     set:function(v){st().memos=v;},     configurable:true});
Object.defineProperty(window,'customCats',{get:function(){return st().customCats;},set:function(v){st().customCats=v;},configurable:true});
Object.defineProperty(window,'currentTab',{get:function(){return st().currentTab;},set:function(v){st().currentTab=v;},configurable:true});
Object.defineProperty(window,'leftFlex',  {get:function(){return st().leftFlex;},  set:function(v){st().leftFlex=v;},  configurable:true});
Object.defineProperty(window,'rightFlex', {get:function(){return st().rightFlex;}, set:function(v){st().rightFlex=v;}, configurable:true});
Object.defineProperty(window,'macroFlex', {get:function(){return st().macroFlex;}, set:function(v){st().macroFlex=v;}, configurable:true});
Object.defineProperty(window,'microFlex', {get:function(){return st().microFlex;}, set:function(v){st().microFlex=v;}, configurable:true});

let editingId=null,dateMode='single';
const CAL={single:{year:2026,month:0,selected:''},start:{year:2026,month:0,selected:''},end:{year:2026,month:0,selected:''}};

function pad(n){return String(n).padStart(2,'0');}
function todayISO(){const t=new Date();return`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;}
function todayLabel(){const t=new Date();return`${t.getFullYear()}年${t.getMonth()+1}月${t.getDate()}日（${WDAYS[t.getDay()]}）`;}
function loadData(){
  // FirestoreからのロードはloadFromFirestoreで行うため、ここは何もしない
}
function saveData(){
  if(window._firestoreSaveData) window._firestoreSaveData(currentWS);
}
function _showSaveStatus(msg){
  const el=document.getElementById('save-status');
  if(el){el.textContent=msg;if(msg==='✓ 保存済み')setTimeout(()=>{if(el)el.textContent='';},2000);}
}
function escH(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function getCatStyle(cat){if(CAT_MAP[cat])return CAT_MAP[cat];const i=customCats.indexOf(cat);return CAT_PALETTE[(BASE_CATS.length+Math.max(0,i))%CAT_PALETTE.length];}
function daysUntil(ds){if(!ds)return null;const t=new Date();t.setHours(0,0,0,0);const g=new Date(ds);g.setHours(0,0,0,0);return Math.floor((g-t)/864e5);}
function fmtShort(iso){if(!iso)return'';const[,m,d]=iso.split('-');return`${parseInt(m)}/${parseInt(d)}`;}
function fmtFull(iso){if(!iso)return'';const[y,m,d]=iso.split('-');return`${y}年${parseInt(m)}月${parseInt(d)}日`;}
function dateToISO(y,m,d){return`${y}-${pad(m+1)}-${pad(d)}`;}

// ── 行高さリサイズ ──
var _rhDrag=false,_rhY0=0,_rhH0=64,_rhWS='';
function startRowResize(e){

function doResize(clientX){
  var wrapper=document.getElementById('yvw-'+currentWS+'-'+_rsY);
  if(!wrapper)return;
  var wRect=wrapper.getBoundingClientRect();
  var dx = clientX - _rsX;
  if(_rsMode==='mid'){
    // マクロ↔ミクロ間: 2列合計幅の中で分配
    var midTotal = wRect.width - 44 - 10 - rightFlex*(wRect.width-44-10)/(_rsL+_rsR+rightFlex);
    var tot=_rsL+_rsR;
    macroFlex = parseFloat(Math.max(0.15, _rsL + dx/(midTotal/tot)).toFixed(3));
    microFlex = parseFloat(Math.max(0.15, tot - macroFlex).toFixed(3));
  } else {
    var totalW = wRect.width - 44 - 10;
    var tot = _rsL + _rsR;
    leftFlex  = parseFloat(Math.max(0.15, _rsL + dx/(totalW/tot)).toFixed(3));
    rightFlex = parseFloat(Math.max(0.15, tot - leftFlex).toFixed(3));
  }
  applyColWidths(_rsY);
}

    document.querySelectorAll('.yh-right,.right-col-wrap').forEach(function(el){el.style.flex=rf;});
  } else {
    var lf=leftFlex+' '+leftFlex+' 0';
    var rf2=rightFlex+' '+rightFlex+' 0';
    document.querySelectorAll('.yh-left').forEach(function(el){el.style.flex=lf;});
    document.querySelectorAll('.yh-right').forEach(function(el){el.style.flex=rf2;});

  }
  if(y) requestAnimationFrame(function(){ positionDragBar(y); });

}

function renderYear(y){
  if(currentWS==='stock'||currentWS==='imaget'){renderYearStock(y);return;}
  const el=document.getElementById('list-'+y+'-'+currentWS);if(!el)return;
  const yI=parseInt(y);
  const yItems=items.filter(i=>i.year===y);const todo=yItems.filter(i=>!i.done),doneItems=yItems.filter(i=>i.done);
  const pct=yItems.length?Math.round(doneItems.length/yItems.length*100):0;
  let html=``;
  const singles=todo.filter(i=>i.date&&!i.dateStart);
  const ranges=todo.filter(i=>i.dateStart);
  const nodates=todo.filter(i=>!i.date&&!i.dateStart);
  const iso=todayISO();const tYear=parseInt(iso.split('-')[0]);const tMonth=parseInt(iso.split('-')[1]);

  // 固定行高さ: 12月が上、1月が下
  const RH=rowHeight;
  const TOTAL_H=RH*12;
  // 月m の行上端px: 12月=0, 11月=64, ..., 1月=704
  function mTop(m){return(12-m)*RH;}
  function dim(m){return new Date(yI,m,0).getDate();}

  // 期間の棒の位置計算
  // 例: 4/28→6/10 → 6月(ceM=6)が上、4月(csM=4)が下
  // topPx = mTop(ceM) + (eD-1)/dim(ceM)*RH (6月10日の位置)
  // botPx = mTop(csM) + sD/dim(csM)*RH (4月28日の位置)
  function barPx(item){
    const s=item.dateStart,e=item.dateEnd||item.dateStart;
    const sM=parseInt(s.split('-')[1]),sD=parseInt(s.split('-')[2]);
    const eM=parseInt(e.split('-')[1]),eD=parseInt(e.split('-')[2]);
    const csM=Math.max(1,Math.min(12,sM)),ceM=Math.max(1,Math.min(12,eM));

/* ── 複数メモ管理ユーティリティ ── */
function getMultiMemos(key){
  // memos[key] は文字列（旧）またはオブジェクト {list:[{id,text}]}（新）
  const raw=memos[key];
  if(!raw)return[{id:Date.now(),text:''}];
  if(typeof raw==='object'&&raw.list)return raw.list.length?raw.list:[{id:Date.now(),text:''}];
  // 旧形式（文字列）→移行
  return [{id:Date.now(),text:raw}];
}
function saveMultiMemos(key,list){memos[key]={list};saveData();}
function addMemoCard(key){
  const list=getMultiMemos(key);
  list.push({id:Date.now(),text:''});
  saveMultiMemos(key,list);
  renderMemoCards(key);
}
function delMemoCard(key,id){
  let list=getMultiMemos(key).filter(m=>m.id!==id);
  if(!list.length)list=[{id:Date.now(),text:''}];
  saveMultiMemos(key,list);
  renderMemoCards(key);
}
function onMemoInput(key,id){
  const list=getMultiMemos(key);

}
function renderMemoCards(key){

}
function buildMultiMemoSection(key,label){

function renderToday(){

  const dueToday=items.filter(i=>!i.done&&getRef(i)===iso);
  const upcoming=items.filter(i=>!i.done&&getRef(i)>iso&&daysUntil(getRef(i))<=7).sort((a,b)=>getRef(a)<getRef(b)?-1:1);
  const soon=items.filter(i=>!i.done&&getRef(i)>iso&&daysUntil(getRef(i))>7&&daysUntil(getRef(i))<=30).sort((a,b)=>getRef(a)<getRef(b)?-1:1);
  const total=overdue.length+dueToday.length+upcoming.length+soon.length;
  function tCard(item){const c=getCatStyle(item.cat);const ref=getRef(item);const d=ref?daysUntil(ref):null;let bc='ok',bt=d===null?'':`あと${d}日`;if(d!==null){if(d<0){bc='overdue';bt=`超過${Math.abs(d)}日`;}else if(d===0){bc='urgent';bt='今日！';}else if(d<=7)bc='urgent';}return`<div class="t-card${item.done?' done':''}"><button class="t-check${item.done?' done':''}" onclick="toggleDone(${item.id})"><svg viewBox="0 0 9 9" fill="none"><path d="M1 4.5L3.5 7L8 2" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="t-body"><div class="t-title">${escH(item.title)}</div><div class="t-meta">${ref?`<span class="t-date">${fmtFull(ref)}</span>`:''} ${bt?`<span class="t-badge ${bc}">${bt}</span>`:''}<span class="t-cat" style="background:${c.bg};color:${c.color}">${escH(item.cat)}</span></div></div><div class="t-actions"><button class="t-act" onclick="openModal(${item.id})"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" width="12" height="12"><path d="M9.5 2.5l2 2L4 12H2v-2L9.5 2.5z"/></svg></button><button class="t-act del" onclick="confirmDelete(${item.id})"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" width="12" height="12"><path d="M2 4h10M5 4V2.5h4V4M5.5 6.5v4M8.5 6.5v4M3 4l.7 7.5h6.6L11 4"/></svg></button></div></div>`;}
  let html=`<div class="today-header"><span class="today-date-text">${todayLabel()}</span><span class="today-count">注目 ${total}件</span></div>`;
  html+=buildMultiMemoSection('today','today のメモ・ノート');

  if(overdue.length){html+=`<div class="today-section-label"><div class="today-dot" style="background:var(--danger-text)"></div>期限超過</div>`;overdue.forEach(i=>{html+=tCard(i);});}
  if(upcoming.length){html+=`<div class="today-section-label"><div class="today-dot" style="background:var(--info-text)"></div>7日以内</div>`;upcoming.forEach(i=>{html+=tCard(i);});}
  if(soon.length){html+=`<div class="today-section-label"><div class="today-dot" style="background:var(--text2)"></div>30日以内</div>`;soon.forEach(i=>{html+=tCard(i);});}
  if(!total)html+=`<div class="empty">期限が近いアイテムはありません<br>直近30日以内の予定がここに表示されます</div>`;
  el.innerHTML=html;
  renderMemoCards('today');
}

function renderDays(n){
  const tabKey=n+'days';
  const el=document.getElementById('list-'+tabKey+'-'+currentWS);if(!el)return;
  const iso=todayISO();const getRef=i=>i.date||i.dateStart||'';
  const future=new Date();future.setDate(future.getDate()+n);
  const futureISO=`${future.getFullYear()}-${pad(future.getMonth()+1)}-${pad(future.getDate())}`;
  const overdue=items.filter(i=>!i.done&&getRef(i)&&getRef(i)<iso).sort((a,b)=>getRef(a)<getRef(b)?1:-1);
  const inRange=items.filter(i=>!i.done&&getRef(i)>=iso&&getRef(i)<=futureISO).sort((a,b)=>getRef(a)<getRef(b)?-1:1);
  const total=overdue.length+inRange.length;
  function tCard(item){const c=getCatStyle(item.cat);const ref=getRef(item);const d=ref?daysUntil(ref):null;let bc='ok',bt=d===null?'':`あと${d}日`;if(d!==null){if(d<0){bc='overdue';bt=`超過${Math.abs(d)}日`;}else if(d===0){bc='urgent';bt='今日！';}else if(d<=7)bc='urgent';}return`<div class="t-card${item.done?' done':''}"><button class="t-check${item.done?' done':''}" onclick="toggleDone(${item.id})"><svg viewBox="0 0 9 9" fill="none"><path d="M1 4.5L3.5 7L8 2" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="t-body"><div class="t-title">${escH(item.title)}</div><div class="t-meta">${ref?`<span class="t-date">${fmtFull(ref)}</span>`:''} ${bt?`<span class="t-badge ${bc}">${bt}</span>`:''}<span class="t-cat" style="background:${c.bg};color:${c.color}">${escH(item.cat)}</span></div></div><div class="t-actions"><button class="t-act" onclick="openModal(${item.id})"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" width="12" height="12"><path d="M9.5 2.5l2 2L4 12H2v-2L9.5 2.5z"/></svg></button><button class="t-act del" onclick="confirmDelete(${item.id})"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" width="12" height="12"><path d="M2 4h10M5 4V2.5h4V4M5.5 6.5v4M8.5 6.5v4M3 4l.7 7.5h6.6L11 4"/></svg></button></div></div>`;}
  let html=`<div class="today-header"><span class="today-date-text">今後 ${n}日間の予定</span><span class="today-count">計 ${total}件</span></div>`;
  html+=buildMultiMemoSection(tabKey,n+'days のメモ・ノート');
  if(inRange.length){html+=`<div class="today-section-label"><div class="today-dot" style="background:var(--info-text)"></div>${n}日以内</div>`;inRange.forEach(i=>{html+=tCard(i);});}

  if(!total)html+=`<div class="empty">この期間のアイテムはありません</div>`;
  el.innerHTML=html;
  renderMemoCards(tabKey);
}
function renderAll(){const el=document.getElementById('list-all-'+currentWS);if(!el)return;if(!items.length){el.innerHTML='<div class="empty">まだアイテムがありません<br>右上の「追加」から登録しよう</div>';return;}const done=items.filter(i=>i.done).length,pct=Math.round(done/items.length*100);let html=`<div class="stats-grid"><div class="stat"><div class="stat-num">${items.length}</div><div class="stat-label">合計</div></div><div class="stat"><div class="stat-num">${done}</div><div class="stat-label">達成済み</div></div><div class="stat"><div class="stat-num">${pct}%</div><div class="stat-label">達成率</div></div></div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div><div class="prog-label">${done}/${items.length} 達成</div><div class="sec-label">年別進捗</div>`;YEARS.forEach(y=>{const yi=items.filter(i=>i.year===y);if(!yi.length)return;const yd=yi.filter(i=>i.done).length,yp=Math.round(yd/yi.length*100);html+=`<div class="ybr"><div class="ybr-top"><span>${y}年</span><span>${yd}/${yi.length} (${yp}%)</span></div><div class="prog-bar" style="margin:0"><div class="prog-fill" style="width:${yp}%"></div></div></div>`;});el.innerHTML=html;}

function triggerDL(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}

function downloadCSV(){const BOM='\uFEFF',hdr=['タイトル','カテゴリ','サブカテゴリ','年','目標日','開始日','終了日','メモ','達成'];const rows=items.map(i=>['"'+(i.title||'').replace(/"/g,'""')+'"','"'+(i.cat||'')+'"','"'+(i.subcat||'')+'"',i.year,i.date||'',i.dateStart||'',i.dateEnd||'','"'+(i.note||'').replace(/"/g,'""')+'"',i.done?'済み':'未達成'].join(','));triggerDL('bucketlist_2026-2036.csv',BOM+hdr.join(',')+'\n'+rows.join('\n'),'text/csv;charset=utf-8');}
function downloadTXT(){const lines=['やりたい事リスト 2026-2036','='.repeat(32),''];if(memos['today'])lines.push('【todayメモ】',memos['today'],'');if(memos['all'])lines.push('【全体メモ】',memos['all'],'');YEARS.forEach(y=>{const yi=items.filter(i=>i.year===y);if(!yi.length&&!memos[y])return;lines.push('【'+y+'年】');if(memos[y])lines.push('メモ：'+memos[y],'');yi.forEach(i=>{lines.push((i.done?'[達成] ':'[ ] ')+i.title);if(i.date)lines.push('  目標日：'+fmtFull(i.date));if(i.dateStart)lines.push('  期間：'+fmtFull(i.dateStart)+(i.dateEnd?' 〜 '+fmtFull(i.dateEnd):''));lines.push('  カテゴリ：'+i.cat+(i.subcat?' / '+i.subcat:''));if(i.note)lines.push('  メモ：'+i.note);lines.push('');});});lines.push('エクスポート：'+new Date().toLocaleString('ja-JP'));triggerDL('bucketlist_2026-2036.txt',lines.join('\n'),'text/plain;charset=utf-8');}
function importJSON(){const file=(document.getElementById('file-input').files||[])[0];const msg=document.getElementById('import-msg');if(!file){msg.textContent='ファイルを選択してください';return;}const reader=new FileReader();reader.onload=e=>{try{const data=JSON.parse(e.target.result);const imported=data.items||(Array.isArray(data)?data:null);if(!imported)throw new Error('形式が正しくありません');items=imported;memos=data.memos||{};customCats=data.customCats||[];if(data.colRatio){leftFlex=data.colRatio[0];rightFlex=data.colRatio[1];}saveData();msg.style.color='#3b6d11';msg.textContent=imported.length+'件を読み込みました';buildPanels();buildNav();setTab('today');}catch(err){msg.style.color='#a32d2d';msg.textContent='読み込みに失敗：'+err.message;}};reader.readAsText(file);}

var IT_PRICE_CAL={

function renderItPriceCal(side){
  var cal=IT_PRICE_CAL[side];
  var lbl=document.getElementById('it-'+side+'-cal-lbl');
  var yrEl=document.getElementById('it-'+side+'-cal-yr');
  var grid=document.getElementById('it-'+side+'-cal-grid');
  if(!lbl||!yrEl||!grid)return;
  lbl.textContent=cal.year+'年'+MONTHS_JP[cal.month];
  yrEl.innerHTML=YEARS_IT.map(function(y){return'<button class="yr-btn'+(parseInt(y)===cal.year?' active':'')+'" onclick="selectItPriceCalYear(\''+side+'\','+y+')">'+y+'</button>';}).join('');
  var today=new Date();today.setHours(0,0,0,0);
  var firstDay=new Date(cal.year,cal.month,1).getDay();
  var dim=new Date(cal.year,cal.month+1,0).getDate();
  var prev=new Date(cal.year,cal.month,0).getDate();
  var html=DOW_JP.map(function(d,i){return'<div class="cal-dow'+(i===0?' sun':i===6?' sat':'')+'">'+ d+'</div>';}).join('');
  for(var i=0;i<firstDay;i++)html+='<button class="cal-day other-month" disabled>'+(prev-firstDay+1+i)+'</button>';
  for(var d=1;d<=dim;d++){
    var iso=dateToISO(cal.year,cal.month,d);
    var dow=(firstDay+d-1)%7;
    var isT=new Date(cal.year,cal.month,d).getTime()===today.getTime();
    var isSel=iso===cal.selected;
    var cls=['cal-day',isT?'today-cal':'',isSel?'selected':'',dow===0?'sun-col':dow===6?'sat-col':''].filter(Boolean).join(' ');
    html+='<button class="'+cls+'" onclick="selectItPriceDate(\''+side+'\',\''+iso+'\')">'+d+'</button>';
  }
  grid.innerHTML=html;
}

// 損益計算
function updateItPnl(){
  const pb=parseFloat(document.getElementById('it-price-buy').value)||0;
  const ps=parseFloat(document.getElementById('it-price-sell').value)||0;
  const el=document.getElementById('it-pnl-display');
  if(!pb||!ps){el.textContent='';return;}
  const diff=ps-pb;
  const pct=((diff/pb)*100).toFixed(1);
  const sign=diff>=0?'+':'';
  const cls=diff>0?'color:#27500a':diff<0?'color:#a32d2d':'color:var(--text3)';
  const label=diff>0?'✅ 利益':diff<0?'❌ 損失':'— 変わらず';
  el.innerHTML=`<span style="${cls}">${label}　${sign}${diff.toFixed(0)}円 (${sign}${pct}%)</span>`;
}
function itPnl(item){
  if(!item.priceBuy||!item.priceSell)return null;
  const diff=item.priceSell-item.priceBuy;
  const pct=((diff/item.priceBuy)*100).toFixed(1);
  return{diff,pct,cls:diff>0?'win':diff<0?'lose':'even',label:diff>0?'✅ 利益':diff<0?'❌ 損失':'— 変わらず'};
}

// 年別レンダリング（月別グリッド）
function renderImagetYear(y){
  const el=document.getElementById('it-list-'+y);if(!el)return;
  const yItems=itItems.filter(i=>i.year===y);
  const yI=parseInt(y);
  const iso=todayISO();
  const tYear=parseInt(iso.split('-')[0]);
  const tMonth=parseInt(iso.split('-')[1]);
  const RH=itRowHeight||64;

  // 進捗バー
  const doneItems=yItems.filter(i=>i.done);
  const pct=yItems.length?Math.round(doneItems.length/yItems.length*100):0;
  const buyTotal=yItems.filter(i=>i.dir==='buy'&&i.priceBuy&&i.qty).reduce((s,i)=>s+i.priceBuy*i.qty,0);
  const buyTotalStr=buyTotal>0?Math.round(buyTotal).toLocaleString()+'円':'—';
  let html=`<div class="stats-grid" style="grid-template-columns:1fr;margin-bottom:.8rem"><div class="stat"><div class="stat-num" style="font-size:15px">${buyTotalStr}</div><div class="stat-label">📈 買い 購入金額合計（価格×株数）</div></div></div>`;
  // 月別グリッド（12月=上、1月=下）
  html+=`<div style="overflow:visible">`;
  // ヘッダー行
  html+=`<div style="display:flex;font-size:11px;font-weight:500;color:var(--text2);border-bottom:0.5px solid var(--border2);padding-bottom:2px;align-items:center">`;
  html+=`<div style="width:44px;flex-shrink:0"></div>`;
  html+=`<div style="flex:1;padding:3px 6px;border-left:0.5px solid var(--border)">🧠 イメトレ記録</div>`;
  html+=`</div>`;

  for(let m=12;m>=1;m--){
    const mStr=pad(m);
    const isCur=(yI===tYear&&m===tMonth);
    // dateフィールド（気づきタイミング）で月を判定
    const mItems=yItems.filter(i=>{
      const ref=i.date||(i.dateBuy)||'';
      return ref.startsWith(y+'-'+mStr);
    }).sort((a,b)=>{
      const da=a.date||a.dateBuy||'';
      const db=b.date||b.dateBuy||'';
      return da<db?-1:1;
    });

    html+=`<div class="month-row${isCur?' current-month-row':''}" style="min-height:${RH}px;overflow:visible;position:relative">`;
    html+=`<div class="row-resize-handle" onmousedown="startItRowResize(event)" ontouchstart="startItRowResize(event)"></div>`;
    // 月ラベル
    html+=`<div class="month-label-cell">`;
    html+=`<span class="month-num${isCur?' current':''}">${m}</span>`;
    html+=`<span class="month-unit${isCur?' current':''}">月</span>`;
    if(isCur)html+=`<div class="today-pip"></div>`;
    html+=`</div>`;
    // カードエリア
    html+=`<div style="flex:1;border-left:0.5px solid var(--border);padding:5px 8px;display:flex;flex-direction:column;gap:5px;min-height:${RH}px">`;
    if(mItems.length){
      mItems.forEach(item=>{
        const pnl=itPnl(item);
        const pnlBadge=pnl?`<span style="font-size:9px;padding:1px 5px;border-radius:20px;font-weight:500;white-space:nowrap;${pnl.diff>0?'background:var(--success-bg);color:var(--success-text)':pnl.diff<0?'background:var(--danger-bg);color:var(--danger-text)':'background:var(--bg2);color:var(--text2)'}">${pnl.diff>=0?'+':''}${pnl.diff.toFixed(0)}円(${pnl.diff>=0?'+':''}${pnl.pct}%)</span>`:'';
        const dirBadge=`<span style="font-size:9px;padding:1px 5px;border-radius:20px;font-weight:600;white-space:nowrap;${item.dir==='buy'?'background:var(--info-bg);color:var(--info-text)':'background:var(--danger-bg);color:var(--danger-text)'}">${item.dir==='buy'?'📈買い':'📉売却'}</span>`;
        const dayLabel=item.date?`<span class="chip-day">${fmtShort(item.date)}</span>`:(item.dateBuy?`<span class="chip-day">${fmtShort(item.dateBuy)}</span>`:'');
        html+=`<div class="single-chip${item.done?' done':''}" style="cursor:pointer;flex-wrap:wrap;gap:4px" onclick="openImagetModal(${item.id})">`;
        html+=dayLabel;
        html+=dirBadge;
        html+=`<span class="chip-title" style="font-weight:600">${escH(item.stock)}</span>`;
        if(item.code)html+=`<span class="chip-cat" style="background:var(--bg2);color:var(--text3)">${escH(item.code)}</span>`;
        html+=`<span class="chip-title" style="font-size:10px;color:var(--text2);font-weight:400">${escH(item.macro)}</span>`;
        if(pnlBadge)html+=pnlBadge;
        html+=`<div class="chip-actions" style="opacity:1">`;
        html+=`<button class="chip-act del" onclick="event.stopPropagation();itDelete(${item.id})" title="削除"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" width="10" height="10"><path d="M2 4h10M5 4V2.5h4V4M5.5 6.5v4M8.5 6.5v4M3 4l.7 7.5h6.6L11 4"/></svg></button>`;
        html+=`</div>`;
        html+=`</div>`;
      });
    }
    html+=`</div>`; // カードエリア
    html+=`</div>`; // month-row
  }

  // データなしメッセージ（グリッド下部）
  if(!yItems.length){
    html+=`<div class="empty" style="padding:1rem;text-align:center;color:var(--text3);font-size:13px">この年の記録はありません<br>右上の「追加」から登録しよう</div>`;
  }

  // 日付なし
  const nodates=yItems.filter(i=>!i.date&&!i.dateBuy);
  if(nodates.length){
    html+=`<div class="no-date-section"><div class="no-date-label">日付未設定</div>`;
    nodates.forEach(item=>{
      const pnl=itPnl(item);

      html+=`<span class="chip-title" style="font-size:10px;color:var(--text2);font-weight:400">${escH(item.macro)}</span>`;

      html+=`</div>`;
    });
    html+=`</div>`;
  }

  // 達成済み
  if(doneItems.length){
    html+=`<div class="done-hdr"><span class="done-lbl">達成済み</span><span class="done-bdg">${doneItems.length}</span></div>`;

      html+=`</div>`;
    });
  }

  html+=`</div>`;
  el.innerHTML=html;
}

var POS_KEY = 'pos_v1';

function setPosDir(d){
  posDir=d;

function updatePosPnl(){
  var pb=parseFloat(document.getElementById('pos-price-buy').value)||0;
  var ps=parseFloat(document.getElementById('pos-price-sell').value)||0;
  var qty=parseFloat(document.getElementById('pos-qty').value)||1;
  var el=document.getElementById('pos-pnl-disp');
  if(!pb||!ps){el.textContent='';return;}
  var diff=ps-pb, pct=((diff/pb)*100).toFixed(1), sign=diff>=0?'+':'';
  var total=(diff*qty).toFixed(0);
  var col=diff>0?'#27500a':diff<0?'#a32d2d':'var(--text3)';
  var lbl=diff>0?'利益':diff<0?'損失':'変わらず';
  el.innerHTML='<span style="color:'+col+'">'+lbl+' '+sign+diff.toFixed(0)+'円/株('+sign+pct+'%) 合計'+sign+total+'円</span>';
}
function calcPosPnl(item){
  if(!item.priceBuy||!item.priceSell)return null;
  var diff=item.priceSell-item.priceBuy;
  var pct=((diff/item.priceBuy)*100).toFixed(1);
  var qty=item.qty||1;
  var total=(diff*qty).toFixed(0);
  return{diff:diff,pct:pct,total:total};
}

// カレンダー
function renderPosCal(side){
  var cal=POS_CAL[side];
  var lbl=document.getElementById('pos-'+side+'-lbl');
  var yr=document.getElementById('pos-'+side+'-yr');
  var grid=document.getElementById('pos-'+side+'-grid');
  if(!lbl||!yr||!grid)return;
  lbl.textContent=cal.year+'年'+MONTHS_JP[cal.month];
  yr.innerHTML=POS_YEARS.map(function(y){
    return '<button class="yr-btn'+(parseInt(y)===cal.year?' active':'')+'" onclick="posCalYr(\''+side+'\','+y+')">'+y+'</button>';
  }).join('');
  var today=new Date();today.setHours(0,0,0,0);
  var fd=new Date(cal.year,cal.month,1).getDay();
  var dim=new Date(cal.year,cal.month+1,0).getDate();
  var prev=new Date(cal.year,cal.month,0).getDate();
  var h=DOW_JP.map(function(d,i){return'<div class="cal-dow'+(i===0?' sun':i===6?' sat':'')+'">'+ d+'</div>';}).join('');
  for(var i=0;i<fd;i++)h+='<button class="cal-day other-month" disabled>'+(prev-fd+1+i)+'</button>';
  for(var d=1;d<=dim;d++){
    var iso=dateToISO(cal.year,cal.month,d);
    var dow=(fd+d-1)%7;
    var isT=new Date(cal.year,cal.month,d).getTime()===today.getTime();
    var isSel=iso===cal.selected;
    var cls=['cal-day',isT?'today-cal':'',isSel?'selected':'',dow===0?'sun-col':dow===6?'sat-col':''].filter(Boolean).join(' ');
    h+='<button class="'+cls+'" onclick="selectPosDate(\''+side+'\',\''+iso+'\')">'+d+'</button>';
  }
  grid.innerHTML=h;
}
function posCalYr(side,y){POS_CAL[side].year=parseInt(y);POS_CAL[side].month=0;renderPosCal(side);}
function posCalNav(side,dir){
  var cal=POS_CAL[side];
  cal.month+=dir;
  if(cal.month<0){cal.month=11;cal.year=Math.max(2019,cal.year-1);}
  if(cal.month>11){cal.month=0;cal.year=Math.min(2030,cal.year+1);}
  renderPosCal(side);
}
function selectPosDate(side,iso){
  POS_CAL[side].selected=iso;
  document.getElementById('pos-date-'+side).value=iso;
  document.getElementById('pos-'+side+'-disp').classList.remove('placeholder');
  document.getElementById('pos-'+side+'-txt').textContent=fmtFull(iso);

function clearPosCal(side){
  POS_CAL[side].selected='';
  document.getElementById('pos-date-'+side).value='';
  document.getElementById('pos-'+side+'-disp').classList.add('placeholder');
  document.getElementById('pos-'+side+'-txt').textContent=side==='buy'?'購入日を選択...':'売却日を選択...';
  renderPosCal(side);
}
function togglePosCal(side){
  var p=document.getElementById('pos-'+side+'-cal');
  ['notice','buy','sell'].forEach(function(s){if(s!==side){var o=document.getElementById('pos-'+s+'-cal');if(o)o.classList.remove('open');}});

}
document.addEventListener('click',function(e){

// 保存
function savePosItem(){
  var macro=(document.getElementById('pos-macro').value||'').trim();
  if(!macro){document.getElementById('pos-macro').focus();return;}
  var stock=(document.getElementById('pos-stock').value||'').trim();
  if(!stock){document.getElementById('pos-stock').focus();return;}
  var theme=(document.getElementById('pos-theme').value||'').trim();
  var code=(document.getElementById('pos-code').value||'').trim();
  var priceBuy=parseFloat(document.getElementById('pos-price-buy').value)||null;
  var priceSell=parseFloat(document.getElementById('pos-price-sell').value)||null;
  var qty=parseFloat(document.getElementById('pos-qty').value)||null;
  var miss=(document.getElementById('pos-miss').value||'').trim();
  var lesson=(document.getElementById('pos-lesson').value||'').trim();
  var dateNotice=document.getElementById('pos-date-notice').value||'';
  var dateBuy=document.getElementById('pos-date-buy').value||'';
  var dateSell=document.getElementById('pos-date-sell').value||'';
  var ref=dateNotice||dateBuy||dateSell||'';
  var year=ref?ref.split('-')[0]:'2026';
  if(posEditId){
    var item=posItems.filter(function(i){return i.id===posEditId;})[0];
    if(item) Object.assign(item,{macro:macro,theme:theme,stock:stock,code:code,priceBuy:priceBuy,priceSell:priceSell,qty:qty,miss:miss,lesson:lesson,dateNotice:dateNotice,dateBuy:dateBuy,dateSell:dateSell,year:year,dir:posDir,updatedAt:new Date().toISOString()});
  } else {
    posItems.push({id:Date.now(),macro:macro,theme:theme,stock:stock,code:code,priceBuy:priceBuy,priceSell:priceSell,qty:qty,miss:miss,lesson:lesson,dateNotice:dateNotice,dateBuy:dateBuy,dateSell:dateSell,year:year,dir:posDir,createdAt:new Date().toISOString()});
  }
  posSave();
  closePosModal();
  renderPosYear(year);
  renderPosNav();
}

// 削除
function posDelete(id){
  if(!confirm('削除しますか？'))return;
  posItems=posItems.filter(function(i){return i.id!==id;});
  posSave();
  renderPosPage();
}

// ナビ

// 銘柄分析（完全独立）

var AN_KEY = 'analysis_v1';
var AN_SLOTS = 50; // 銘柄1〜50

// データ構造: { order:[0,1,2,...49], slots:[{name,code,...}, ...×50] }
var anData = { order:[], slots:[] };
(function(){
  // order初期化
  if(!anData.order || anData.order.length !== AN_SLOTS){
    anData.order = [];
    for(var i=0;i<AN_SLOTS;i++) anData.order.push(i);
  }
  // slots初期化
  if(!anData.slots) anData.slots = [];
  while(anData.slots.length < AN_SLOTS) anData.slots.push(null);
})();

function anSave(){
  if(window._firestoreSaveSpecial)window._firestoreSaveSpecial('analysis',{data:anData});
}

var anForecastRows = [{year:'',value:'',note:''}];

}
function removeAnRow(type,idx){
  if(type==='sales'){ anSalesRows.splice(idx,1); if(!anSalesRows.length) anSalesRows.push({year:'',value:'',note:''}); }
  else { anForecastRows.splice(idx,1); if(!anForecastRows.length) anForecastRows.push({year:'',value:'',note:''}); }
  renderAnRows(type);
}
function syncAnRows(type){
  var rows = type==='sales' ? anSalesRows : anForecastRows;
  var prefix = type==='sales' ? 'an-s' : 'an-f';
  rows.forEach(function(r,i){
    var y=document.getElementById(prefix+'-year-'+i);
    var v=document.getElementById(prefix+'-val-'+i);
    var n=document.getElementById(prefix+'-note-'+i);
    if(y) r.year=y.value;
    if(v) r.value=v.value;
    if(n) r.note=n.value;
  });
}
function renderAnRows(type){
  var rows = type==='sales' ? anSalesRows : anForecastRows;
  var containerId = type==='sales' ? 'an-sales-rows' : 'an-forecast-rows';
  var prefix = type==='sales' ? 'an-s' : 'an-f';
  var el = document.getElementById(containerId); if(!el) return;
  var h='';
  rows.forEach(function(r,i){
    h+='<div style="display:grid;grid-template-columns:80px 1fr 1fr auto;gap:6px;margin-bottom:5px;align-items:center">';
    h+='<input type="text" id="'+prefix+'-year-'+i+'" value="'+escH(r.year)+'" placeholder="年度" style="padding:6px 8px;font-size:12px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;outline:none;width:100%">';
    h+='<input type="text" id="'+prefix+'-val-'+i+'" value="'+escH(r.value)+'" placeholder="売上（例：3.2億円）" style="padding:6px 8px;font-size:12px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;outline:none;width:100%">';
    h+='<input type="text" id="'+prefix+'-note-'+i+'" value="'+escH(r.note)+'" placeholder="メモ（例：前年比+30%）" style="padding:6px 8px;font-size:12px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;outline:none;width:100%">';
    h+='<button onclick="removeAnRow(\''+type+'\','+i+')" style="border:none;background:transparent;cursor:pointer;color:var(--text3);font-size:14px;padding:2px 4px;border-radius:3px;line-height:1" title="削除">×</button>';
    h+='</div>';
  });
  el.innerHTML=h;
}

// ── モーダル開閉 ──
function openAnalysisModal(slotIdx){
  anEditingSlot = (slotIdx !== undefined) ? slotIdx : anCurrentSlot;
  var slot = anData.slots[anEditingSlot] || {};
  var num = anData.order.indexOf(anEditingSlot)+1;
  document.getElementById('analysis-modal-title').textContent = '銘柄'+num+'の分析を入力';
  document.getElementById('an-name').value = slot.name||'';
  document.getElementById('an-code').value = slot.code||'';
  document.getElementById('an-market').value = slot.market||'';
  document.getElementById('an-sector').value = slot.sector||'';
  document.getElementById('an-biz').value = slot.biz||'';
  document.getElementById('an-tam').value = slot.tam||'';
  document.getElementById('an-strength').value = slot.strength||'';
  document.getElementById('an-competitor').value = slot.competitor||'';
  document.getElementById('an-risk').value = slot.risk||'';
  document.getElementById('an-memo').value = slot.memo||'';
  anSalesRows = (slot.sales && slot.sales.length) ? JSON.parse(JSON.stringify(slot.sales)) : [{year:'',value:'',note:''}];
  anForecastRows = (slot.forecast && slot.forecast.length) ? JSON.parse(JSON.stringify(slot.forecast)) : [{year:'',value:'',note:''}];
  renderAnRows('sales');
  renderAnRows('forecast');
  document.getElementById('analysis-modal-overlay').classList.add('open');
  setTimeout(function(){ document.getElementById('an-name').focus(); },50);
}
function closeAnalysisModal(){
  document.getElementById('analysis-modal-overlay').classList.remove('open');
  anEditingSlot=null;
}

function clearAnalysis(){
  if(anEditingSlot===null)return;
  anData.slots[anEditingSlot]=null;
  anSave();
  closeAnalysisModal();
  renderAnalysisNav();
  renderAnalysisPanel(anEditingSlot);
}

function saveAnalysis(){
  syncAnRows('sales');
  syncAnRows('forecast');
  var slot = anData.slots[anEditingSlot] || {};
  slot.name = (document.getElementById('an-name').value||'').trim();
  slot.code = (document.getElementById('an-code').value||'').trim();
  slot.market = (document.getElementById('an-market').value||'').trim();
  slot.sector = (document.getElementById('an-sector').value||'').trim();
  slot.biz = (document.getElementById('an-biz').value||'').trim();
  slot.tam = (document.getElementById('an-tam').value||'').trim();
  slot.strength = (document.getElementById('an-strength').value||'').trim();
  slot.competitor = (document.getElementById('an-competitor').value||'').trim();
  slot.risk = (document.getElementById('an-risk').value||'').trim();
  slot.memo = (document.getElementById('an-memo').value||'').trim();
  slot.sales = anSalesRows.filter(function(r){return r.year||r.value;});
  slot.forecast = anForecastRows.filter(function(r){return r.year||r.value;});
  slot.updatedAt = new Date().toISOString();
  anData.slots[anEditingSlot] = slot;
  anSave();
  closeAnalysisModal();
  renderAnalysisNav();
  renderAnalysisPanel(anEditingSlot);
}

// ── ナビ（ドラッグ並び替え対応）──
var anDragSrc = null;
function renderAnalysisNav(){
  var nav = document.getElementById('nav-analysis'); if(!nav) return;
  var h='';
  anData.order.forEach(function(slotIdx, orderPos){
    var slot = anData.slots[slotIdx];
    var label = slot && slot.name ? slot.name : '銘柄'+(orderPos+1);
    var isActive = slotIdx === anCurrentSlot;
    h+='<button class="tab'+(isActive?' active':'')+'"'
      +' draggable="true"'
      +' data-slot="'+slotIdx+'"'
      +' data-order="'+orderPos+'"'
      +' onclick="setAnalysisTab('+slotIdx+')"'
      +' ondragstart="anDragStart(event,'+orderPos+')"'
      +' ondragover="anDragOver(event)"'
      +' ondrop="anDrop(event,'+orderPos+')"'
      +' ondragend="anDragEnd(event)"'
      +' title="ドラッグで並び替え"'
      +' style="cursor:grab;user-select:none"'
      +'>'+escH(label)+'</button>';
  });
  nav.innerHTML=h;
}

function anDragStart(e, orderPos){
  anDragSrc = orderPos;
  e.dataTransfer.effectAllowed='move';
  e.target.style.opacity='0.5';
}
function anDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
}
function anDrop(e, targetOrder){
  e.preventDefault();
  if(anDragSrc===null || anDragSrc===targetOrder) return;
  var moved = anData.order.splice(anDragSrc,1)[0];
  anData.order.splice(targetOrder,0,moved);
  anSave();
  anDragSrc=null;
  renderAnalysisNav();
}
function anDragEnd(e){
  e.target.style.opacity='';
  anDragSrc=null;
}

function setAnalysisTab(slotIdx){
  anCurrentSlot = slotIdx;
  renderAnalysisNav();
  renderAnalysisPanel(slotIdx);
}

// ── パネル描画 ──
function buildAnalysisPanels(){
  var wrap = document.getElementById('panels-analysis'); if(!wrap) return;
  var h='';
  for(var i=0;i<AN_SLOTS;i++){
    h+='<div id="an-panel-'+i+'" class="panel'+(i===anCurrentSlot?' active':'')+'"><div id="an-content-'+i+'"></div></div>';
  }
  wrap.innerHTML=h;
}

function renderAnalysisPanel(slotIdx){
  // パネル表示切替
  document.querySelectorAll('[id^="an-panel-"]').forEach(function(el){el.classList.remove('active');});
  var panel = document.getElementById('an-panel-'+slotIdx); if(panel) panel.classList.add('active');

  var el = document.getElementById('an-content-'+slotIdx); if(!el) return;
  var slot = anData.slots[slotIdx];
  var orderPos = anData.order.indexOf(slotIdx);

  if(!slot || !slot.name){
    el.innerHTML='<div class="empty" style="padding:3rem 1rem;text-align:center;color:var(--text3);font-size:13px;line-height:2.5">'

      +'<button class="icon-btn primary" onclick="openAnalysisModal('+slotIdx+')" style="margin-top:8px"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" width="13" height="13"><path d="M7 2v10M2 7h10"/></svg>分析を入力する</button>'

  h+='<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.8rem;gap:8px">';
  h+='<div>';

  h+='</div>';
  var badges='';
  if(slot.market) badges+='<span style="font-size:10px;padding:1px 7px;border-radius:20px;background:var(--bg2);color:var(--text2);margin-right:4px">'+escH(slot.market)+'</span>';
  if(slot.sector) badges+='<span style="font-size:10px;padding:1px 7px;border-radius:20px;background:var(--info-bg);color:var(--info-text);margin-right:4px">'+escH(slot.sector)+'</span>';
  if(badges) h+='<div style="margin-top:4px">'+badges+'</div>';
  h+='</div>';
  h+='<button class="icon-btn" onclick="openAnalysisModal('+slotIdx+')" style="flex-shrink:0"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" width="12" height="12"><path d="M9.5 2.5l2 2L4 12H2v-2L9.5 2.5z"/></svg>編集</button>';
  h+='</div>';

  function section(label, val){
    if(!val) return '';

      +'<div style="font-size:13px;color:var(--text);line-height:1.7;white-space:pre-wrap">'+escH(val)+'</div></div>';
  }

  h+=section('事業概要', slot.biz);
  h+=section('市場規模（TAM/SAM/SOM）', slot.tam);

  // 売上実績テーブル
  if(slot.sales && slot.sales.length){
    h+='<div style="margin-bottom:.7rem"><div style="font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px">売上実績</div>';
    h+='<table style="width:100%;border-collapse:collapse;font-size:12px">';
    h+='<tr style="background:var(--bg2)"><th style="padding:4px 8px;text-align:left;border:0.5px solid var(--border);color:var(--text2);font-weight:500">年度</th><th style="padding:4px 8px;text-align:left;border:0.5px solid var(--border);color:var(--text2);font-weight:500">売上</th><th style="padding:4px 8px;text-align:left;border:0.5px solid var(--border);color:var(--text2);font-weight:500">メモ</th></tr>';
    slot.sales.forEach(function(r){
      h+='<tr><td style="padding:4px 8px;border:0.5px solid var(--border);color:var(--text)">'+escH(r.year)+'</td><td style="padding:4px 8px;border:0.5px solid var(--border);color:var(--text);font-weight:500">'+escH(r.value)+'</td><td style="padding:4px 8px;border:0.5px solid var(--border);color:var(--text2)">'+escH(r.note)+'</td></tr>';
