    h+='</table></div>';
  }

  // 将来予想テーブル
  if(slot.forecast && slot.forecast.length){
    h+='<div style="margin-bottom:.7rem"><div style="font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px">将来売上予想</div>';
    h+='<table style="width:100%;border-collapse:collapse;font-size:12px">';
    h+='<tr style="background:var(--bg2)"><th style="padding:4px 8px;text-align:left;border:0.5px solid var(--border);color:var(--text2);font-weight:500">年度</th><th style="padding:4px 8px;text-align:left;border:0.5px solid var(--border);color:var(--text2);font-weight:500">予想売上</th><th style="padding:4px 8px;text-align:left;border:0.5px solid var(--border);color:var(--text2);font-weight:500">メモ</th></tr>';
    slot.forecast.forEach(function(r){
      h+='<tr><td style="padding:4px 8px;border:0.5px solid var(--border);color:var(--text)">'+escH(r.year)+'</td><td style="padding:4px 8px;border:0.5px solid var(--border);color:var(--info-text);font-weight:500">'+escH(r.value)+'</td><td style="padding:4px 8px;border:0.5px solid var(--border);color:var(--text2)">'+escH(r.note)+'</td></tr>';

    var d=new Date(slot.updatedAt);
    h+='<div style="font-size:10px;color:var(--text3);text-align:right;margin-top:.5rem">最終更新：'+d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+'</div>';
  }

  h+='</div>';
  el.innerHTML=h;
}

// ── switchWS に analysis を追加 ──
var _swAn = switchWS;
switchWS = function(wsId){
  if(wsId==='analysis'){
    document.querySelectorAll('.ws-tab').forEach(function(b){b.classList.remove('active');});
    document.querySelector('.ws-tab.ws-analysis').classList.add('active');
    document.querySelectorAll('.ws-content').forEach(function(d){d.classList.remove('active');});
    document.getElementById('ws-analysis').classList.add('active');
    buildAnalysisPanels();
    renderAnalysisNav();
    renderAnalysisPanel(anCurrentSlot);
  } else {
    _swAn(wsId);
  }
};

// 株イメトレ・株ポジション 行高さリサイズ
// ══════════════════════════════════════════════
var itRowHeight = 64;
var posRowHeight = 64;
try{ var _irh=localStorage.getItem('it_row_height'); if(_irh) itRowHeight=parseInt(_irh)||64; }catch(e){}
try{ var _prh=localStorage.getItem('pos_row_height'); if(_prh) posRowHeight=parseInt(_prh)||64; }catch(e){}

var _itrhDrag=false,_itrhY0=0,_itrhH0=64;
var _posrhDrag=false,_posrhY0=0,_posrhH0=64;

function startItRowResize(e){
  _itrhDrag=true;
  _itrhY0=e.clientY||(e.touches&&e.touches[0].clientY)||0;
  _itrhH0=itRowHeight;
  document.body.style.cursor='row-resize';
  document.body.style.userSelect='none';
  e.preventDefault();e.stopPropagation();
}
function startPosRowResize(e){
  _posrhDrag=true;
  _posrhY0=e.clientY||(e.touches&&e.touches[0].clientY)||0;
  _posrhH0=posRowHeight;
  document.body.style.cursor='row-resize';
  document.body.style.userSelect='none';
  e.preventDefault();e.stopPropagation();
}

document.addEventListener('mousemove',function(e){
  if(_itrhDrag){
    var dy=e.clientY-_itrhY0;
    itRowHeight=Math.max(32,Math.min(200,_itrhH0+dy));
    renderImagetPage();
  }
  if(_posrhDrag){
    var dy=e.clientY-_posrhY0;
    posRowHeight=Math.max(32,Math.min(200,_posrhH0+dy));
    renderPosPage();
  }
});
document.addEventListener('touchmove',function(e){
  if(_itrhDrag){
    var dy=e.touches[0].clientY-_itrhY0;
    itRowHeight=Math.max(32,Math.min(200,_itrhH0+dy));
    renderImagetPage();
  }
  if(_posrhDrag){
    var dy=e.touches[0].clientY-_posrhY0;
    posRowHeight=Math.max(32,Math.min(200,_posrhH0+dy));
    renderPosPage();
  }
},{passive:false});
document.addEventListener('mouseup',function(){
  if(_itrhDrag){ _itrhDrag=false; document.body.style.cursor=''; document.body.style.userSelect=''; try{localStorage.setItem('it_row_height',itRowHeight);}catch(e){} }
  if(_posrhDrag){ _posrhDrag=false; document.body.style.cursor=''; document.body.style.userSelect=''; try{localStorage.setItem('pos_row_height',posRowHeight);}catch(e){} }
});
document.addEventListener('touchend',function(){
  if(_itrhDrag){ _itrhDrag=false; try{localStorage.setItem('it_row_height',itRowHeight);}catch(e){} }
  if(_posrhDrag){ _posrhDrag=false; try{localStorage.setItem('pos_row_height',posRowHeight);}catch(e){} }
});

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut as fbSignOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAiptupENyVJNuucHXTklchXzJdHB2JBT0",
  authDomain: "management-note.firebaseapp.com",
  projectId: "management-note",
  storageBucket: "management-note.firebasestorage.app",
  messagingSenderId: "584614877505",
  appId: "1:584614877505:web:f1b2892f5e64befc8c69c0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let currentUser = null;

window.signInWithGoogle = async function() {
  const provider = new GoogleAuthProvider();
  try { await signInWithPopup(auth, provider); } catch(e) { alert('サインインに失敗しました: ' + e.message); }
};

window.doSignOut = async function() {

};

// デバウンス付き保存
const _saveTimers = {};
function debouncedSave(key, fn, delay=1200) {
  if(_saveTimers[key]) clearTimeout(_saveTimers[key]);
  _saveTimers[key] = setTimeout(fn, delay);
  _showSaveStatus('保存中...');
}

// WS（time/dream/stock）のFirestore保存
window._firestoreSaveData = function(wsId) {
  if(!currentUser) return;
  const uid = currentUser.uid;
  const ws = WS_STATE[wsId];
  debouncedSave('ws_'+wsId, async () => {
    try {
      await setDoc(doc(db,'users',uid,'workspaces',wsId), {
        items: ws.items,
        memos: ws.memos,
        customCats: ws.customCats,
        colRatio: [ws.leftFlex, ws.rightFlex],
        colRatio2: [ws.macroFlex, ws.microFlex],
        rowHeight: ws.rowHeight,
        updatedAt: new Date().toISOString()
      });
      _showSaveStatus('✓ 保存済み');
    } catch(e) { _showSaveStatus('⚠ 保存失敗'); console.error(e); }
  });
};

// 特殊データ（imaget/position/analysis）のFirestore保存
window._firestoreSaveSpecial = function(key, data) {
  if(!currentUser) return;
  const uid = currentUser.uid;
  debouncedSave('special_'+key, async () => {
    try {
      await setDoc(doc(db,'users',uid,'special',key), { ...data, updatedAt: new Date().toISOString() });
      _showSaveStatus('✓ 保存済み');
    } catch(e) { _showSaveStatus('⚠ 保存失敗'); console.error(e); }
  });
};

async function loadAllData(uid) {
  // WS別データ
  const wsIds = ['time','dream','stock'];
  for(const wsId of wsIds) {
    try {
      const snap = await getDoc(doc(db,'users',uid,'workspaces',wsId));
      if(snap.exists()) {
        const d = snap.data();
        WS_STATE[wsId].items = d.items || [];
        WS_STATE[wsId].memos = d.memos || {};
        WS_STATE[wsId].customCats = d.customCats || [];
        if(d.colRatio){ WS_STATE[wsId].leftFlex=d.colRatio[0]; WS_STATE[wsId].rightFlex=d.colRatio[1]; }
        if(d.colRatio2){ WS_STATE[wsId].macroFlex=d.colRatio2[0]; WS_STATE[wsId].microFlex=d.colRatio2[1]; }
        if(d.rowHeight) WS_STATE[wsId].rowHeight=d.rowHeight;
      }
    } catch(e){ console.error('WS load error:', wsId, e); }
  }
  // 株イメトレ
  try {
    const snap = await getDoc(doc(db,'users',uid,'special','imaget'));
    if(snap.exists() && snap.data().items) itItems = snap.data().items;
  } catch(e){ console.error('imaget load error', e); }
  // 株ポジション
  try {
    const snap = await getDoc(doc(db,'users',uid,'special','position'));
    if(snap.exists() && snap.data().items) posItems = snap.data().items;
  } catch(e){ console.error('position load error', e); }
  // 銘柄分析
  try {
    const snap = await getDoc(doc(db,'users',uid,'special','analysis'));
    if(snap.exists() && snap.data().data) {
      const d = snap.data().data;
      anData = d;
      if(!anData.order || anData.order.length !== 50){ anData.order=[]; for(var i=0;i<50;i++) anData.order.push(i); }
      if(!anData.slots) anData.slots=[];
      while(anData.slots.length < 50) anData.slots.push(null);
    }
  } catch(e){ console.error('analysis load error', e); }
}

onAuthStateChanged(auth, async (user) => {
  document.getElementById('loading-screen').style.display = 'none';
  if(user) {
    currentUser = user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    const avatar = document.getElementById('user-avatar');
    if(user.photoURL){ avatar.src=user.photoURL; avatar.style.display='block'; }
    document.getElementById('user-name').textContent = user.displayName || user.email;
    await loadAllData(user.uid);
    currentWS = 'time';
    buildNav(); buildPanels(); rerender();
  } else {
    currentUser = null;
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});
</script>
