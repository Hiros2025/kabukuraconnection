<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マネジメントノート 2026–2036</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f5f5f3;--bg3:#efefec;
  --text:#1a1a18;--text2:#6b6b67;--text3:#a8a8a3;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.25);
  --success-bg:#eaf3de;--success-text:#27500a;
  --info-bg:#e6f1fb;--info-text:#0c447c;
  --warn-bg:#faeeda;--warn-text:#633806;
  --danger-bg:#fcebeb;--danger-text:#a32d2d;
  --r:8px;--rl:12px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1e1e1c;--bg2:#2a2a27;--bg3:#323230;
    --text:#f0f0ec;--text2:#a8a8a3;--text3:#6b6b67;
    --border:rgba(255,255,255,0.12);--border2:rgba(255,255,255,0.28);
    --success-bg:#173404;--success-text:#c0dd97;
    --info-bg:#042c53;--info-text:#85b7eb;
    --warn-bg:#412402;--warn-text:#fac775;
    --danger-bg:#501313;--danger-text:#f09595;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;padding:1.5rem 1rem}
.container{max-width:900px;margin:0 auto}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;gap:8px;flex-wrap:wrap}
.app-title{font-size:20px;font-weight:500;color:var(--text)}
.app-sub{font-size:12px;color:var(--text3);margin-top:2px}
.top-actions{display:flex;gap:6px}
.icon-btn{padding:6px 13px;font-size:12px;border-radius:var(--r);cursor:pointer;border:0.5px solid var(--border2);background:transparent;color:var(--text);display:inline-flex;align-items:center;gap:5px;transition:background .12s;font-family:inherit;white-space:nowrap}
.icon-btn:hover{background:var(--bg2)}
.icon-btn.primary{background:var(--text);color:var(--bg);border-color:transparent}
.icon-btn.primary:hover{opacity:.85;background:var(--text)}
.icon-btn svg{width:13px;height:13px;flex-shrink:0}
.nav-wrap{overflow-x:auto;margin-bottom:1.1rem;padding-bottom:3px}
.nav-wrap::-webkit-scrollbar{height:3px}
.nav-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.nav{display:flex;gap:3px;background:var(--bg2);border-radius:var(--r);padding:4px;width:max-content;min-width:100%}
.tab{padding:5px 11px;font-size:12px;border:none;background:transparent;border-radius:6px;cursor:pointer;color:var(--text2);white-space:nowrap;transition:all .15s;font-family:inherit}
.tab.active{background:var(--bg);color:var(--text);font-weight:500;border:0.5px solid var(--border)}
.tab:hover:not(.active){background:var(--bg)}
.tab.today-tab{color:var(--info-text)}
.tab.today-tab.active{color:var(--info-text);border-color:var(--info-bg)}
.tab-divider{width:0.5px;background:var(--border);margin:4px 2px;flex-shrink:0}
.panel{display:none}.panel.active{display:block}
.memo-label{font-size:11px;color:var(--text3);margin-bottom:4px}
.memo-area{width:100%;min-height:52px;resize:vertical;font-size:13px;padding:8px 11px;border:0.5px solid var(--border);border-radius:var(--rl);background:var(--bg);color:var(--text);font-family:inherit;line-height:1.6;margin-bottom:.8rem}
.memo-area:focus{outline:none;border-color:var(--border2)}
.prog-bar{height:3px;background:var(--bg2);border-radius:2px;margin:.4rem 0;overflow:hidden}
.prog-fill{height:100%;background:#3b6d11;border-radius:2px;transition:width .4s}
.prog-label{font-size:11px;color:var(--text2);text-align:right;margin-bottom:.5rem}
.right-cell{padding:0;position:relative;overflow:visible;min-width:80px}
.gantt-area{position:absolute;inset:0;display:flex;flex-direction:row;gap:2px;padding:0 3px;}
.gantt-col{flex:1;position:relative;height:100%;min-width:12px;max-width:40px;}
.gantt-bar{position:absolute;left:0;right:0;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:filter .12s;min-height:3px;}
.gantt-bar:hover{filter:brightness(0.88)}
.gantt-bar.done{opacity:.4}
.gantt-bar-title{writing-mode:vertical-rl;text-orientation:mixed;font-size:10px;font-weight:600;color:rgba(255,255,255,0.95);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%;line-height:1.2;transform:rotate(180deg);padding:3px 0;user-select:none;pointer-events:none;}
.year-view-wrapper{position:relative;overflow:visible}
.year-view-header{display:flex;font-size:11px;font-weight:500;color:var(--text2);border-bottom:0.5px solid var(--border2);padding-bottom:2px;align-items:center}
.yh-month{width:44px;flex-shrink:0;padding:3px 5px}
.yh-left{padding:3px 6px;overflow:hidden;min-width:60px}
.yh-right{padding:3px 6px;min-width:80px}
.col-resize-handle{width:14px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;}
.year-view{display:flex;flex-direction:column;overflow:visible}
.month-row{display:flex;border-top:0.5px solid var(--border);overflow:visible}
.month-row.current-month-row{background:rgba(14,99,200,0.03)}
.month-label-cell{width:44px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 4px 4px;gap:1px}
.month-num{font-size:15px;font-weight:600;color:var(--text3);line-height:1}
.month-unit{font-size:9px;color:var(--text3)}
.month-num.current{color:var(--info-text)}
.month-unit.current{color:var(--info-text)}
.today-pip{width:5px;height:5px;border-radius:50%;background:var(--info-text);margin-top:2px}
.left-cell{border-left:0.5px solid var(--border);padding:4px 6px;display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:60px}
.row-resize-spacer{width:14px;flex-shrink:0}
.single-chip{display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:var(--r);background:var(--bg);border:0.5px solid var(--border);cursor:default;flex-wrap:nowrap;min-height:22px}
.single-chip:hover{border-color:var(--border2)}
.single-chip.done{opacity:.4}.single-chip.done .chip-title{text-decoration:line-through}
.chip-check{width:13px;height:13px;border-radius:50%;border:1.2px solid var(--border2);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chip-check.done{background:var(--success-bg);border-color:var(--success-text)}
.chip-check svg{display:none;width:7px;height:7px}.chip-check.done svg{display:block}
.chip-day{font-size:10px;font-weight:600;color:var(--text2);white-space:nowrap;flex-shrink:0}
.chip-badge{font-size:9px;padding:1px 5px;border-radius:20px;font-weight:500;white-space:nowrap;flex-shrink:0}
.chip-badge.ok{background:var(--info-bg);color:var(--info-text)}
.chip-badge.urgent{background:var(--warn-bg);color:var(--warn-text)}
.chip-badge.overdue{background:var(--danger-bg);color:var(--danger-text)}
.chip-title{font-size:11px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.chip-cat{font-size:9px;padding:1px 4px;border-radius:20px;font-weight:500;flex-shrink:0;white-space:nowrap}
.chip-actions{display:flex;gap:1px;flex-shrink:0;opacity:0;transition:opacity .15s}
.single-chip:hover .chip-actions{opacity:1}
.chip-act{font-size:9px;border:none;background:transparent;cursor:pointer;color:var(--text3);padding:1px 3px;border-radius:3px;display:flex;align-items:center;font-family:inherit}
.chip-act:hover{background:var(--bg2);color:var(--text)}
.chip-act.del:hover{color:var(--danger-text);background:var(--danger-bg)}
.no-date-section{margin-top:.7rem}
.no-date-label{font-size:11px;color:var(--text3);margin-bottom:4px;font-weight:500}
.done-hdr{display:flex;align-items:center;gap:6px;margin:.7rem 0 4px}
.done-lbl{font-size:12px;font-weight:500;color:var(--text2)}
.done-bdg{font-size:10px;padding:1px 7px;border-radius:20px;background:var(--success-bg);color:var(--success-text);font-weight:500}
.empty{text-align:center;padding:2rem 1rem;color:var(--text3);font-size:13px;line-height:2.2}
.today-header{background:var(--info-bg);border-radius:var(--rl);padding:.75rem 1rem;margin-bottom:.9rem;display:flex;align-items:center;justify-content:space-between}
.today-date-text{font-size:13px;font-weight:500;color:var(--info-text)}
.today-count{font-size:11px;color:var(--info-text);opacity:.8}
.today-memo-wrap{margin-bottom:.9rem}
.today-memo-label{font-size:11px;color:var(--text3);margin-bottom:4px}
.today-memo{width:100%;min-height:50px;resize:vertical;font-size:13px;padding:8px 11px;border:0.5px solid var(--border);border-radius:var(--rl);background:var(--bg);color:var(--text);font-family:inherit;line-height:1.6}
.today-memo:focus{outline:none;border-color:var(--border2)}
.today-section-label{font-size:11px;font-weight:500;color:var(--text2);margin:1rem 0 5px;display:flex;align-items:center;gap:6px}
.today-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.t-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:.6rem .9rem;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.t-card:hover{border-color:var(--border2)}
.t-card.done{opacity:.4}.t-card.done .t-title{text-decoration:line-through}
.t-check{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.t-check.done{background:var(--success-bg);border-color:var(--success-text)}
.t-check svg{display:none;width:8px;height:8px}.t-check.done svg{display:block}
.t-body{flex:1;min-width:0}
.t-title{font-size:13px;font-weight:500;color:var(--text)}
.t-meta{display:flex;align-items:center;gap:5px;margin-top:2px;flex-wrap:wrap}
.t-date{font-size:11px;color:var(--text2)}
.t-badge{font-size:10px;padding:1px 6px;border-radius:20px;font-weight:500}
.t-badge.ok{background:var(--info-bg);color:var(--info-text)}
.t-badge.urgent{background:var(--warn-bg);color:var(--warn-text)}
.t-badge.overdue{background:var(--danger-bg);color:var(--danger-text)}
.t-cat{font-size:10px;padding:1px 6px;border-radius:20px;font-weight:500}
.t-actions{display:flex;gap:2px;flex-shrink:0}
.t-act{font-size:11px;border:none;background:transparent;cursor:pointer;color:var(--text3);padding:3px 4px;border-radius:3px;display:flex;align-items:center;font-family:inherit}
.t-act:hover{background:var(--bg2);color:var(--text)}
.t-act.del:hover{color:var(--danger-text);background:var(--danger-bg)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.stat{background:var(--bg2);border-radius:var(--r);padding:.65rem .8rem;text-align:center}
.stat-num{font-size:19px;font-weight:500;color:var(--text)}
.stat-label{font-size:11px;color:var(--text2);margin-top:2px}
.sec-label{font-size:12px;font-weight:500;color:var(--text2);margin:1rem 0 7px}
.ybr{margin-bottom:8px}
.ybr-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.ybr-top span:first-child{font-weight:500;color:var(--text)}
.ybr-top span:last-child{color:var(--text2)}
.dl-section{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:.9rem 1rem;margin-bottom:.9rem}
.dl-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:9px}
.dl-btns{display:flex;gap:7px;flex-wrap:wrap}
.notice{font-size:11px;color:var(--text3);margin-top:7px}
#import-msg{font-size:12px;margin-top:6px;display:block;min-height:15px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:flex-start;justify-content:center;padding:1rem;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:1.25rem;width:100%;max-width:500px;position:relative;margin:auto}
.modal-title{font-size:14px;font-weight:500;color:var(--text);margin-bottom:1rem}
.modal-close{position:absolute;top:10px;right:12px;font-size:18px;border:none;background:transparent;cursor:pointer;color:var(--text3);font-family:inherit}
.modal-close:hover{color:var(--text)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.fr.full{grid-template-columns:1fr}
.fr.three{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;margin-bottom:8px;align-items:end}
.fr-arrow{font-size:14px;color:var(--text3);padding-bottom:9px;text-align:center}
.fg label{display:block;font-size:11px;color:var(--text2);margin-bottom:3px}
.fg input[type=text],.fg select{width:100%;padding:7px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;outline:none}
.fg input:focus,.fg select:focus{border-color:var(--text)}
.cat-custom-wrap{margin-top:5px}
.cat-custom-wrap input{width:100%;padding:6px 10px;font-size:12px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:inherit;outline:none}
.modal-actions{display:flex;gap:8px;margin-top:12px}
.section-divider{border:none;border-top:0.5px solid var(--border);margin:10px 0}
.date-mode-tabs{display:flex;gap:4px;margin-bottom:8px}
.dmode-btn{padding:4px 12px;font-size:11px;border:0.5px solid var(--border2);border-radius:20px;cursor:pointer;background:transparent;color:var(--text2);transition:all .12s;font-family:inherit}
.dmode-btn:hover{background:var(--bg2)}
.dmode-btn.active{background:var(--text);color:var(--bg);border-color:transparent;font-weight:500}
.date-picker-wrap{position:relative}
.date-display{width:100%;padding:7px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px;font-family:inherit}
.date-display:hover{border-color:var(--text2)}
.date-display svg{width:12px;height:12px;flex-shrink:0;color:var(--text3)}
.date-display.placeholder{color:var(--text3)}
.cal-popup{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:200;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--rl);padding:10px;min-width:260px;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
.cal-popup.open{display:block}
.cal-year-strip{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px;padding-bottom:8px;border-bottom:0.5px solid var(--border)}
.yr-btn{padding:3px 8px;font-size:11px;border:0.5px solid var(--border);border-radius:20px;cursor:pointer;background:transparent;color:var(--text2);transition:all .12s;font-family:inherit}
.yr-btn:hover{background:var(--bg2)}
.yr-btn.active{background:var(--text);color:var(--bg);border-color:transparent;font-weight:500}
.cal-month-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-month-label span{font-size:12px;font-weight:500;color:var(--text)}
.cal-nav{background:transparent;border:none;cursor:pointer;color:var(--text2);padding:2px 6px;border-radius:4px;font-size:16px;line-height:1;font-family:inherit}
.cal-nav:hover{background:var(--bg2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
.cal-dow{font-size:9px;color:var(--text3);padding:2px 0;font-weight:500}
.cal-dow.sun{color:#c0392b}.cal-dow.sat{color:#2980b9}
.cal-day{font-size:11px;padding:4px 0;border-radius:5px;cursor:pointer;color:var(--text);border:none;background:transparent;width:100%;font-family:inherit}
.cal-day:hover:not(:disabled){background:var(--bg2)}
.cal-day.today-cal{font-weight:500;color:var(--info-text)}
.cal-day.selected{background:var(--text);color:var(--bg)!important;font-weight:500}
.cal-day.other-month{color:var(--text3)}
.cal-day.sun-col{color:#c0392b}.cal-day.sat-col{color:#2980b9}
.cal-day:disabled{opacity:.3;cursor:default}
.cal-clear{margin-top:6px;padding-top:6px;border-top:0.5px solid var(--border)}
.cal-clear button{font-size:11px;padding:2px 8px;border:0.5px solid var(--border2);border-radius:var(--r);background:transparent;cursor:pointer;color:var(--text2);font-family:inherit}
.cal-clear button:hover{background:var(--bg2)}
.ws-bar{display:flex;gap:0;margin-bottom:0;border-bottom:2px solid var(--border2);}
.ws-tab{padding:10px 22px;font-size:13px;font-weight:500;border:none;background:transparent;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;font-family:inherit;transition:all .15s;white-space:nowrap;letter-spacing:0.01em;}
.ws-tab:hover{color:var(--text);background:var(--bg2);}
.ws-tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:600;}
.ws-tab.ws-time.active{color:#0c447c;border-bottom-color:#0c447c;}
.ws-tab.ws-dream.active{color:#3b6d11;border-bottom-color:#3b6d11;}
.ws-tab.ws-stock.active{color:#633806;border-bottom-color:#633806;}
.ws-content{display:none;}.ws-content.active{display:block;}
.ws-header-label{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text3);margin-bottom:1rem;padding:4px 0;border-bottom:0.5px solid var(--border);}
.multi-memo-wrap{margin-bottom:.9rem}
.memo-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:.75rem .9rem;margin-bottom:8px;position:relative}
.memo-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.memo-card-label{font-size:11px;color:var(--text3);font-weight:500}
.memo-card-del{background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:14px;padding:0 2px;line-height:1;border-radius:3px}
.memo-card-del:hover{color:var(--danger-text);background:var(--danger-bg)}
.memo-card textarea{width:100%;min-height:52px;resize:vertical;font-size:13px;padding:7px 10px;border:0.5px solid var(--border);border-radius:var(--r);background:var(--bg2);color:var(--text);font-family:inherit;line-height:1.6}
.memo-card textarea:focus{outline:none;border-color:var(--border2)}
.add-memo-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);background:transparent;border:0.5px dashed var(--border2);border-radius:var(--r);padding:5px 12px;cursor:pointer;transition:all .15s;font-family:inherit;margin-bottom:.9rem}
.add-memo-btn:hover{color:var(--text);border-color:var(--border2);background:var(--bg2)}

/* ログイン画面 */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:1.5rem;}
.login-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:2.5rem 2rem;text-align:center;max-width:360px;width:100%;}
.login-title{font-size:20px;font-weight:500;margin-bottom:.4rem;}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:2rem;}
.google-btn{display:inline-flex;align-items:center;gap:10px;padding:10px 20px;font-size:14px;border:1px solid var(--border2);border-radius:var(--r);cursor:pointer;background:var(--bg);color:var(--text);font-family:inherit;transition:background .15s;width:100%;justify-content:center;}
.google-btn:hover{background:var(--bg2);}
.google-btn img{width:18px;height:18px;}
.user-info{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);}
.user-avatar{width:24px;height:24px;border-radius:50%;}
.save-status{font-size:11px;color:var(--text3);margin-left:4px;}

/* ローディング */
#loading-screen{display:flex;align-items:center;justify-content:center;min-height:80vh;font-size:14px;color:var(--text2);}
</style>
</head>
<body>
<div class="container">

  <!-- ローディング -->
  <div id="loading-screen">読み込み中...</div>

  <!-- ログイン画面 -->
  <div id="login-screen" style="display:none">
    <div class="login-card">
      <div class="login-title">マネジメントノート</div>

window.signInWithGoogle = async function() {

};

async function loadFromFirestore(uid) {
  try {
    const WS_LIST_IDS = ['time','dream','stock'];
    for(const wsId of WS_LIST_IDS) {
      const ref = doc(db, 'users', uid, 'workspaces', wsId);
      const snap = await getDoc(ref);
      if(snap.exists()) {
        const d = snap.data();
        WS_STATE[wsId].items = d.items || [];
        WS_STATE[wsId].memos = d.memos || {};
        WS_STATE[wsId].customCats = d.customCats || [];
        if(d.colRatio){ WS_STATE[wsId].leftFlex=d.colRatio[0]; WS_STATE[wsId].rightFlex=d.colRatio[1]; }
        if(d.colRatio2){ WS_STATE[wsId].macroFlex=d.colRatio2[0]; WS_STATE[wsId].microFlex=d.colRatio2[1]; }
      }
    }
  } catch(e) { console.error('Firestore読込エラー:', e); }
}

window._saveToFirestore = async function(wsId) {
  if(!currentUser) return;
  const uid = currentUser.uid;
  const ws = WS_STATE[wsId];
  try {
    const ref = doc(db, 'users', uid, 'workspaces', wsId);
    await setDoc(ref, {
      items: ws.items,
      memos: ws.memos,
      customCats: ws.customCats,
      colRatio: [ws.leftFlex, ws.rightFlex],
      colRatio2: [ws.macroFlex, ws.microFlex],
      updatedAt: new Date().toISOString()
    });
    document.getElementById('save-status').textContent = '✓ 保存済み';
    setTimeout(()=>{ const el=document.getElementById('save-status'); if(el) el.textContent=''; }, 2000);
  } catch(e) {
    console.error('Firestore保存エラー:', e);
    document.getElementById('save-status').textContent = '⚠ 保存失敗';
  }
};

onAuthStateChanged(auth, async (user) => {
  document.getElementById('loading-screen').style.display = 'none';
  if(user) {
    currentUser = user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    const avatar = document.getElementById('user-avatar');
    if(user.photoURL){ avatar.src=user.photoURL; avatar.style.display='block'; }
    document.getElementById('user-name').textContent = user.displayName || user.email;
    await loadFromFirestore(user.uid);
    currentWS = 'time';
    buildNav(); buildPanels(); rerender();
  } else {
    currentUser = null;
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});
</script>

<script>
const YEARS=['2026','2027','2028','2029','2030','2031','2032','2033','2034','2035','2036'];

  {id:'time', label:'タイムマネジメント'},

const BASE_CATS=['プロジェクト①','プロジェクト②','プロジェクト③','プロジェクト④','プロジェクト⑤','プロジェクト⑥','プロジェクト⑦','健康','資格','学び','旅行','人間関係','家族'];

  {bg:'#E6F1FB',color:'#0C447C',bar:'#6baed6'},{bg:'#EEEDFE',color:'#3C3489',bar:'#9e8fd4'},

  {bg:'#FBEAF0',color:'#72243E',bar:'#df65b0'},{bg:'#FAEEDA',color:'#633806',bar:'#fd8d3c'},
  {bg:'#FAECE7',color:'#712B13',bar:'#fc8d59'},{bg:'#E6F1FB',color:'#185FA5',bar:'#4292c6'},
  {bg:'#EAF3DE',color:'#3B6D11',bar:'#78c679'},{bg:'#FAEEDA',color:'#854F0B',bar:'#fe9929'},
  {bg:'#FBEAF0',color:'#993556',bar:'#e7298a'},{bg:'#F1EFE8',color:'#444441',bar:'#969696'},
];
const CAT_MAP={};BASE_CATS.forEach((c,i)=>{CAT_MAP[c]=CAT_PALETTE[i];});
const MONTHS_JP=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const WDAYS=['日','月','火','水','木','金','土'];
const DOW_JP=['日','月','火','水','木','金','土'];

const WS_STATE={};
WS_LIST.forEach(function(w){
  WS_STATE[w.id]={items:[],memos:{},customCats:[],currentTab:'today',leftFlex:1,rightFlex:1.8,macroFlex:1,microFlex:1};
});
function st(){return WS_STATE[currentWS];}
Object.defineProperty(window,'items',     {get:function(){return st().items;},     set:function(v){st().items=v;},     configurable:true});
Object.defineProperty(window,'memos',     {get:function(){return st().memos;},     set:function(v){st().memos=v;},     configurable:true});
Object.defineProperty(window,'customCats',{get:function(){return st().customCats;},set:function(v){st().customCats=v;},configurable:true});
Object.defineProperty(window,'currentTab',{get:function(){return st().currentTab;},set:function(v){st().currentTab=v;},configurable:true});
Object.defineProperty(window,'leftFlex',  {get:function(){return st().leftFlex;},  set:function(v){st().leftFlex=v;},  configurable:true});
Object.defineProperty(window,'rightFlex', {get:function(){return st().rightFlex;}, set:function(v){st().rightFlex=v;}, configurable:true});
Object.defineProperty(window,'macroFlex', {get:function(){return st().macroFlex;}, set:function(v){st().macroFlex=v;}, configurable:true});
Object.defineProperty(window,'microFlex', {get:function(){return st().microFlex;}, set:function(v){st().microFlex=v;}, configurable:true});

let editingId=null,dateMode='single';
const CAL={single:{year:2026,month:0,selected:''},start:{year:2026,month:0,selected:''},end:{year:2026,month:0,selected:''}};

function pad(n){return String(n).padStart(2,'0');}
function todayISO(){const t=new Date();return`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;}
function todayLabel(){const t=new Date();return`${t.getFullYear()}年${t.getMonth()+1}月${t.getDate()}日（${WDAYS[t.getDay()]}）`;}

// Firestoreへの保存（デバウンス付き）
function saveData(){
  if(window._saveToFirestore){
    if(window._saveTimer) clearTimeout(window._saveTimer);
    window._saveTimer = setTimeout(()=>{ window._saveToFirestore(currentWS); }, 1000);
    const el=document.getElementById('save-status');
    if(el) el.textContent='保存中...';
  }
}

function escH(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function getCatStyle(cat){if(CAT_MAP[cat])return CAT_MAP[cat];const i=customCats.indexOf(cat);return CAT_PALETTE[(BASE_CATS.length+Math.max(0,i))%CAT_PALETTE.length];}
function daysUntil(ds){if(!ds)return null;const t=new Date();t.setHours(0,0,0,0);const g=new Date(ds);g.setHours(0,0,0,0);return Math.floor((g-t)/864e5);}
function fmtShort(iso){if(!iso)return'';const[,m,d]=iso.split('-');return`${parseInt(m)}/${parseInt(d)}`;}
function fmtFull(iso){if(!iso)return'';const[y,m,d]=iso.split('-');return`${y}年${parseInt(m)}月${parseInt(d)}日`;}
function dateToISO(y,m,d){return`${y}-${pad(m+1)}-${pad(d)}`;}

var _rsY=null,_rsX=0,_rsL=0,_rsR=0,_rsDrag=false,_rsMode='main';
function startResize(e,y,mode){_rsMode=mode||'main';_rsY=y;_rsX=e.clientX;_rsDrag=true;if(_rsMode==='mid'){_rsL=macroFlex;_rsR=microFlex;}else{_rsL=leftFlex;_rsR=rightFlex;}document.body.style.cursor='col-resize';document.body.style.userSelect='none';e.preventDefault();}
function startResizeTouch(e,y,mode){_rsMode=mode||'main';_rsY=y;_rsX=e.touches[0].clientX;_rsDrag=true;if(_rsMode==='mid'){_rsL=macroFlex;_rsR=microFlex;}else{_rsL=leftFlex;_rsR=rightFlex;}e.preventDefault();}
document.addEventListener('mousemove',function(e){if(!_rsDrag||!_rsY)return;doResize(e.clientX);});
document.addEventListener('touchmove',function(e){if(!_rsDrag||!_rsY)return;doResize(e.touches[0].clientX);e.preventDefault();},{passive:false});
document.addEventListener('mouseup',function(){if(!_rsDrag)return;_rsDrag=false;document.body.style.cursor='';document.body.style.userSelect='';saveData();});
document.addEventListener('touchend',function(){if(!_rsDrag)return;_rsDrag=false;saveData();});
function doResize(clientX){var wrapper=document.getElementById('yvw-'+currentWS+'-'+_rsY);if(!wrapper)return;var wRect=wrapper.getBoundingClientRect();var dx=clientX-_rsX;if(_rsMode==='mid'){var tot=_rsL+_rsR;macroFlex=parseFloat(Math.max(0.15,_rsL+dx/((wRect.width-44-10)/tot)).toFixed(3));microFlex=parseFloat(Math.max(0.15,tot-macroFlex).toFixed(3));}else{var totalW=wRect.width-44-10;var tot=_rsL+_rsR;leftFlex=parseFloat(Math.max(0.15,_rsL+dx/(totalW/tot)).toFixed(3));rightFlex=parseFloat(Math.max(0.15,tot-leftFlex).toFixed(3));}applyColWidths(_rsY);}
function positionDragBar(y){var wrapper=document.getElementById('yvw-'+currentWS+'-'+y);if(!wrapper)return;var wRect=wrapper.getBoundingClientRect();var bar=document.getElementById('drag-bar-'+currentWS+'-'+y);if(bar){var rightCol=wrapper.querySelector('.right-col-wrap');if(rightCol){bar.style.left=(rightCol.getBoundingClientRect().left-wRect.left-5)+'px';bar.style.transform='none';}}var midBar=document.getElementById('drag-bar-mid-'+currentWS+'-'+y);if(midBar){var totalColW=wRect.width-44-14;var totalFlex=macroFlex+microFlex+rightFlex;var macroW=totalColW*(macroFlex/totalFlex);midBar.style.left=(44+macroW-5)+'px';midBar.style.transform='none';}}
function applyColWidths(y){if(currentWS==='stock'){document.querySelectorAll('.stock-macro-col').forEach(function(el){el.style.flex=macroFlex+' '+macroFlex+' 0';});document.querySelectorAll('.stock-micro-col').forEach(function(el){el.style.flex=microFlex+' '+microFlex+' 0';});document.querySelectorAll('.yh-right,.right-col-wrap').forEach(function(el){el.style.flex=rightFlex+' '+rightFlex+' 0';});}else{document.querySelectorAll('.yh-left').forEach(function(el){el.style.flex=leftFlex+' '+leftFlex+' 0';});document.querySelectorAll('.yh-right').forEach(function(el){el.style.flex=rightFlex+' '+rightFlex+' 0';});document.querySelectorAll('.left-col-wrap').forEach(function(el){el.style.flex=leftFlex+' '+leftFlex+' 0';});document.querySelectorAll('.left-cell').forEach(function(el){el.style.flex=leftFlex+' '+leftFlex+' 0';});document.querySelectorAll('.right-col-wrap').forEach(function(el){el.style.flex=rightFlex+' '+rightFlex+' 0';});}if(y)positionDragBar(y);else{YEARS.forEach(function(yr){positionDragBar(yr);});}}

function buildYearStrip(k){document.getElementById('cal-yr-'+k).innerHTML=YEARS.map(y=>`<button class="yr-btn${parseInt(y)===CAL[k].year?' active':''}" onclick="selectCalYear('${k}',${y})">${y}</button>`).join('');}
function selectCalYear(k,y){CAL[k].year=y;CAL[k].month=0;buildYearStrip(k);renderCalGrid(k);}
function calNav(k,dir){CAL[k].month+=dir;if(CAL[k].month<0){CAL[k].month=11;CAL[k].year=Math.max(2026,CAL[k].year-1);}if(CAL[k].month>11){CAL[k].month=0;CAL[k].year=Math.min(2036,CAL[k].year+1);}buildYearStrip(k);renderCalGrid(k);}
function renderCalGrid(k){const{year,month,selected}=CAL[k];document.getElementById('cal-lbl-'+k).textContent=`${year}年${MONTHS_JP[month]}`;const today=new Date();today.setHours(0,0,0,0);const firstDay=new Date(year,month,1).getDay(),daysInMonth=new Date(year,month+1,0).getDate(),prevDays=new Date(year,month,0).getDate();let html=DOW_JP.map((d,i)=>`<div class="cal-dow${i===0?' sun':i===6?' sat':''}">${d}</div>`).join('');for(let i=0;i<firstDay;i++){html+=`<button class="cal-day other-month" disabled>${prevDays-firstDay+1+i}</button>`;}for(let d=1;d<=daysInMonth;d++){const iso=dateToISO(year,month,d);const dow=(firstDay+d-1)%7;const isT=new Date(year,month,d).getTime()===today.getTime();const isSel=iso===selected;const cls=['cal-day',isT?'today-cal':'',isSel?'selected':'',dow===0?'sun-col':dow===6?'sat-col':''].filter(Boolean).join(' ');html+=`<button class="${cls}" onclick="selectDate('${k}','${iso}')">${d}</button>`;}document.getElementById('cal-grid-'+k).innerHTML=html;}
function selectDate(k,iso){CAL[k].selected=iso;if(k==='single')document.getElementById('inp-date').value=iso;else if(k==='start'){document.getElementById('inp-date-start').value=iso;updateRangeDuration();}else{document.getElementById('inp-date-end').value=iso;updateRangeDuration();}updateDisplayBtn(k,iso);renderCalGrid(k);setTimeout(()=>document.getElementById('cal-popup-'+k).classList.remove('open'),120);}
function clearCal(k){CAL[k].selected='';if(k==='single')document.getElementById('inp-date').value='';else if(k==='start'){document.getElementById('inp-date-start').value='';updateRangeDuration();}else{document.getElementById('inp-date-end').value='';updateRangeDuration();}updateDisplayBtn(k,'');renderCalGrid(k);}
function updateDisplayBtn(k,iso){const btn=document.getElementById('date-display-'+k);const txt=document.getElementById('date-text-'+k);const ph={single:'日付を選択...',start:'開始日...',end:'終了日...'};if(iso){txt.textContent=fmtFull(iso);btn.classList.remove('placeholder');}else{txt.textContent=ph[k];btn.classList.add('placeholder');}}
function updateRangeDuration(){const s=document.getElementById('inp-date-start').value,e=document.getElementById('inp-date-end').value;const el=document.getElementById('range-duration');if(s&&e){const d=Math.floor((new Date(e)-new Date(s))/864e5)+1;el.textContent=d>0?`期間：${d}日間（${fmtShort(s)} 〜 ${fmtShort(e)}）`:'※終了日は開始日以降';}else el.textContent='';}
function toggleCal(k){['single','start','end'].forEach(j=>{if(j!==k)document.getElementById('cal-popup-'+j).classList.remove('open');});const p=document.getElementById('cal-popup-'+k);if(p.classList.contains('open'))p.classList.remove('open');else{buildYearStrip(k);renderCalGrid(k);p.classList.add('open');}}
document.addEventListener('click',function(e){const ws=document.querySelectorAll('.date-picker-wrap');let inside=false;ws.forEach(w=>{if(w.contains(e.target))inside=true;});if(!inside)['single','start','end'].forEach(k=>{const p=document.getElementById('cal-popup-'+k);if(p)p.classList.remove('open');});},true);
function setDateMode(m){dateMode=m;document.getElementById('dmode-single').classList.toggle('active',m==='single');document.getElementById('dmode-range').classList.toggle('active',m==='range');document.getElementById('date-single-wrap').style.display=m==='single'?'':'none';document.getElementById('date-range-wrap').style.display=m==='range'?'':'none';}

function switchWS(wsId){currentWS=wsId;document.querySelectorAll('.ws-tab').forEach(b=>b.classList.remove('active'));document.querySelector('.ws-tab.ws-'+wsId).classList.add('active');document.querySelectorAll('.ws-content').forEach(d=>d.classList.remove('active'));document.getElementById('ws-'+wsId).classList.add('active');buildNav();buildPanels();rerender();}

function buildCatOptions(sel){const base=currentWS==='stock'?STOCK_CATS:BASE_CATS;const all=[...base,...customCats];let h=all.map(c=>`<option value="${escH(c)}"${c===sel?' selected':''}>${escH(c)}</option>`).join('');h+=`<option value="__custom__">+ カスタム入力...</option>`;document.getElementById('inp-cat').innerHTML=h;}
function onCatChange(){const v=document.getElementById('inp-cat').value;document.getElementById('cat-custom-wrap').style.display=v==='__custom__'?'block':'none';}
let stockEventType='macro';
function setStockType(t){stockEventType=t;['macro','micro','range'].forEach(s=>{var btn=document.getElementById('stype-'+(s==='range'?'range2':s));if(btn)btn.classList.toggle('active',s===t);});document.getElementById('date-single-wrap').style.display=t==='range'?'none':'';document.getElementById('date-range-wrap').style.display=t==='range'?'':'none';if(t!=='range')dateMode='single';else dateMode='range';}

function openModal(id){editingId=id||null;const item=id?items.find(i=>i.id===id):null;document.getElementById('modal-title').textContent=item?'アイテムを編集':'アイテムを追加';document.getElementById('modal-save-btn').textContent=item?'保存する':'追加する';buildCatOptions(item?item.cat:(currentWS==='stock'?STOCK_CATS[0]:BASE_CATS[0]));document.getElementById('inp-title').value=item?item.title:'';document.getElementById('inp-note').value=item?item.note:'';document.getElementById('inp-subcat').value=item?(item.subcat||''):'';document.getElementById('cat-custom-wrap').style.display='none';document.getElementById('inp-cat-label').value='';var isStock=(currentWS==='stock');document.getElementById('stock-event-type-wrap').style.display=isStock?'':'none';document.getElementById('normal-date-mode-tabs').style.display=isStock?'none':'';if(isStock){var stype=(item&&item.stockType)||'macro';setStockType(stype);}else{const initMode=item&&item.dateStart?'range':'single';setDateMode(initMode);}['single','start','end'].forEach(k=>{CAL[k]={year:2026,month:0,selected:''};});document.getElementById('inp-date').value='';document.getElementById('inp-date-start').value='';document.getElementById('inp-date-end').value='';updateDisplayBtn('single','');updateDisplayBtn('start','');updateDisplayBtn('end','');document.getElementById('range-duration').textContent='';if(item){if(item.date){const[dy,dm]=item.date.split('-');CAL.single={year:parseInt(dy),month:parseInt(dm)-1,selected:item.date};document.getElementById('inp-date').value=item.date;updateDisplayBtn('single',item.date);}if(item.dateStart){const[sy,sm]=item.dateStart.split('-');CAL.start={year:parseInt(sy),month:parseInt(sm)-1,selected:item.dateStart};document.getElementById('inp-date-start').value=item.dateStart;updateDisplayBtn('start',item.dateStart);}if(item.dateEnd){const[ey,em]=item.dateEnd.split('-');CAL.end={year:parseInt(ey),month:parseInt(em)-1,selected:item.dateEnd};document.getElementById('inp-date-end').value=item.dateEnd;updateDisplayBtn('end',item.dateEnd);}updateRangeDuration();}['single','start','end'].forEach(k=>document.getElementById('cal-popup-'+k).classList.remove('open'));document.getElementById('modal-overlay').classList.add('open');setTimeout(()=>document.getElementById('inp-title').focus(),50);}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');editingId=null;}
function overlayClick(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}
function saveItem(){const title=(document.getElementById('inp-title').value||'').trim();if(!title){document.getElementById('inp-title').focus();return;}let cat=document.getElementById('inp-cat').value;if(cat==='__custom__'){cat=(document.getElementById('inp-cat-label').value||'').trim();if(!cat)return;const allFixed=[...BASE_CATS,...STOCK_CATS];if(!allFixed.includes(cat)&&!customCats.includes(cat))customCats.push(cat);}const note=(document.getElementById('inp-note').value||'').trim(),subcat=(document.getElementById('inp-subcat').value||'').trim();let date='',dateStart='',dateEnd='',year='2026';if(dateMode==='single'){date=document.getElementById('inp-date').value;year=date?date.split('-')[0]:(YEARS.includes(currentTab)?currentTab:'2026');}else{dateStart=document.getElementById('inp-date-start').value;dateEnd=document.getElementById('inp-date-end').value;const ref=dateStart||dateEnd;year=ref?ref.split('-')[0]:(YEARS.includes(currentTab)?currentTab:'2026');}if(editingId){const item=items.find(i=>i.id===editingId);if(item){var upd={title,cat,subcat,date,dateStart,dateEnd,year,note,updatedAt:new Date().toISOString()};if(currentWS==='stock')upd.stockType=stockEventType;Object.assign(item,upd);}}else{var newItem={id:Date.now(),title,cat,subcat,date,dateStart,dateEnd,year,note,done:false,createdAt:new Date().toISOString()};if(currentWS==='stock')newItem.stockType=stockEventType;items.push(newItem);}saveData();const wasEditing=!!editingId;closeModal();if(wasEditing)rerender();else setTab(year);}

function buildNav(){const navId='nav-'+currentWS;const nav=document.getElementById(navId);if(!nav)return;let html=`<button class="tab today-tab${currentTab==='today'?' active':''}" onclick="setTab('today')">today</button>`;html+=`<button class="tab today-tab${currentTab==='7days'?' active':''}" onclick="setTab('7days')">7days</button>`;html+=`<button class="tab today-tab${currentTab==='30days'?' active':''}" onclick="setTab('30days')">30days</button>`;html+=`<div class="tab-divider"></div>`;YEARS.forEach(y=>{html+=`<button class="tab${currentTab===y?' active':''}" onclick="setTab('${y}')">${y}</button>`;});html+=`<button class="tab${currentTab==='all'?' active':''}" onclick="setTab('all')">all</button>`;nav.innerHTML=html;}
function buildPanels(){const wrap=document.getElementById('panels-'+currentWS);if(!wrap)return;let html='';html+=`<div id="panel-today-${currentWS}" class="panel${currentTab==='today'?' active':''}"><div id="list-today-${currentWS}"></div></div>`;html+=`<div id="panel-7days-${currentWS}" class="panel${currentTab==='7days'?' active':''}"><div id="list-7days-${currentWS}"></div></div>`;html+=`<div id="panel-30days-${currentWS}" class="panel${currentTab==='30days'?' active':''}"><div id="list-30days-${currentWS}"></div></div>`;YEARS.forEach(y=>{html+=`<div id="panel-${y}-${currentWS}" class="panel${y===currentTab?' active':''}"><div class="memo-label">${y}年のメモ・ノート</div><textarea class="memo-area" id="memo-${y}-${currentWS}" placeholder="${y}年の夢、目標など..." oninput="saveMemo('${y}')">${escH(memos[y]||'')}</textarea><div id="list-${y}-${currentWS}"></div></div>`;});html+=`<div id="panel-all-${currentWS}" class="panel${'all'===currentTab?' active':''}"><div class="memo-label">全体メモ・ノート</div><textarea class="memo-area" id="memo-all-${currentWS}" placeholder="全体のビジョン..." oninput="saveMemo('all')">${escH(memos['all']||'')}</textarea><div id="list-all-${currentWS}"></div></div>`;html+=`<div id="panel-保存読込-${currentWS}" class="panel${'保存読込'===currentTab?' active':''}"><div class="dl-section"><div class="dl-title">ダウンロード</div><div class="dl-btns"><button class="icon-btn" onclick="downloadJSON()">JSON形式</button><button class="icon-btn" onclick="downloadCSV()">CSV</button><button class="icon-btn" onclick="downloadTXT()">テキスト</button></div><p class="notice">JSONは完全バックアップ。読み込みで復元できます。</p></div><div class="dl-section"><div class="dl-title">JSONファイルから読み込み（データ復元）</div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><input type="file" id="file-input" accept=".json" style="font-size:12px;color:var(--text2)"><button class="icon-btn" onclick="importJSON()">読み込む</button></div><span id="import-msg"></span></div></div>`;wrap.innerHTML=html;}
function setTab(t){currentTab=t;buildNav();document.getElementById('panels-'+currentWS).querySelectorAll('.panel').forEach(el=>el.classList.remove('active'));const p=document.getElementById('panel-'+t+'-'+currentWS);if(p)p.classList.add('active');rerender();}
function saveMemo(k){const el=document.getElementById('memo-'+k+'-'+currentWS);if(el){memos[k]=el.value;saveData();}}
function rerender(){if(currentTab==='today')renderToday();else if(currentTab==='7days')renderDays(7);else if(currentTab==='30days')renderDays(30);else if(YEARS.includes(currentTab))renderYear(currentTab);else if(currentTab==='all')renderAll();}
function toggleDone(id){const item=items.find(i=>i.id===id);if(item){item.done=!item.done;saveData();}rerender();}
function confirmDelete(id){if(!confirm('削除しますか？'))return;items=items.filter(i=>i.id!==id);saveData();rerender();}

function getMultiMemos(key){const raw=memos[key];if(!raw)return[{id:Date.now(),text:''}];if(typeof raw==='object'&&raw.list)return raw.list.length?raw.list:[{id:Date.now(),text:''}];return[{id:Date.now(),text:raw}];}
function saveMultiMemos(key,list){memos[key]={list};saveData();}
function addMemoCard(key){const list=getMultiMemos(key);list.push({id:Date.now(),text:''});saveMultiMemos(key,list);renderMemoCards(key);}
function delMemoCard(key,id){let list=getMultiMemos(key).filter(m=>m.id!==id);if(!list.length)list=[{id:Date.now(),text:''}];saveMultiMemos(key,list);renderMemoCards(key);}
function onMemoInput(key,id){const list=getMultiMemos(key);const m=list.find(m=>m.id===id);if(m){m.text=document.getElementById('mc-'+key+'-'+id+'-'+currentWS)?.value||'';}saveMultiMemos(key,list);}
function renderMemoCards(key){const el=document.getElementById('memo-multi-'+key+'-'+currentWS);if(!el)return;const list=getMultiMemos(key);let h='';list.forEach((m,idx)=>{const canDel=list.length>1;h+=`<div class="memo-card"><div class="memo-card-header"><span class="memo-card-label">メモ・ノート ${list.length>1?idx+1:''}</span>${canDel?`<button class="memo-card-del" onclick="delMemoCard('${key}',${m.id})">×</button>`:''}</div><textarea id="mc-${key}-${m.id}-${currentWS}" placeholder="気づき、やること..." oninput="onMemoInput('${key}',${m.id})">${escH(m.text||'')}</textarea></div>`;});el.innerHTML=h;}
function buildMultiMemoSection(key,label){return`<div class="multi-memo-wrap"><div class="memo-label">${label}</div><div id="memo-multi-${key}-${currentWS}"></div><button class="add-memo-btn" onclick="addMemoCard('${key}')"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" width="12" height="12"><path d="M7 2v10M2 7h10"/></svg>+ メモ・ノートを追加</button></div>`;}

function renderToday(){const el=document.getElementById('list-today-'+currentWS);if(!el)return;const iso=todayISO();const getRef=i=>i.date||i.dateStart||'';const overdue=items.filter(i=>!i.done&&getRef(i)&&getRef(i)<iso).sort((a,b)=>getRef(a)<getRef(b)?1:-1);const dueToday=items.filter(i=>!i.done&&getRef(i)===iso);const upcoming=items.filter(i=>!i.done&&getRef(i)>iso&&daysUntil(getRef(i))<=7).sort((a,b)=>getRef(a)<getRef(b)?-1:1);const soon=items.filter(i=>!i.done&&getRef(i)>iso&&daysUntil(getRef(i))>7&&daysUntil(getRef(i))<=30).sort((a,b)=>getRef(a)<getRef(b)?-1:1);const total=overdue.length+dueToday.length+upcoming.length+soon.length;function tCard(item){const c=getCatStyle(item.cat);const ref=getRef(item);const d=ref?daysUntil(ref):null;let bc='ok',bt=d===null?'':`あと${d}日`;if(d!==null){if(d<0){bc='overdue';bt=`超過${Math.abs(d)}日`;}else if(d===0){bc='urgent';bt='今日！';}else if(d<=7)bc='urgent';}return`<div class="t-card${item.done?' done':''}"><button class="t-check${item.done?' done':''}" onclick="toggleDone(${item.id})"><svg viewBox="0 0 9 9" fill="none"><path d="M1 4.5L3.5 7L8 2" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="t-body"><div class="t-title">${escH(item.title)}</div><div class="t-meta">${ref?`<span class="t-date">${fmtFull(ref)}</span>`:''} ${bt?`<span class="t-badge ${bc}">${bt}</span>`:''}<span class="t-cat" style="background:${c.bg};color:${c.color}">${escH(item.cat)}</span></div></div><div class="t-actions"><button class="t-act" onclick="openModal(${item.id})"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" width="12" height="12"><path d="M9.5 2.5l2 2L4 12H2v-2L9.5 2.5z"/></svg></button><button class="t-act del" onclick="confirmDelete(${item.id})"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" width="12" height="12"><path d="M2 4h10M5 4V2.5h4V4M5.5 6.5v4M8.5 6.5v4M3 4l.7 7.5h6.6L11 4"/></svg></button></div></div>`;}let html=`<div class="today-header"><span class="today-date-text">${todayLabel()}</span><span class="today-count">注目 ${total}件</span></div>`;html+=buildMultiMemoSection('today','today のメモ・ノート');if(dueToday.length){html+=`<div class="today-section-label"><div class="today-dot" style="background:var(--warn-text)"></div>今日が期限</div>`;dueToday.forEach(i=>{html+=tCard(i);});}if(overdue.length){html+=`<div class="today-section-label"><div class="today-dot" style="background:var(--danger-text)"></div>期限超過</div>`;overdue.forEach(i=>{html+=tCard(i);});}if(upcoming.length){html+=`<div class="today-section-label"><div class="today-dot" style="background:var(--info-text)"></div>7日以内</div>`;upcoming.forEach(i=>{html+=tCard(i);});}if(soon.length){html+=`<div class="today-section-label"><div class="today-dot" style="background:var(--text2)"></div>30日以内</div>`;soon.forEach(i=>{html+=tCard(i);});}if(!total)html+=`<div class="empty">期限が近いアイテムはありません<br>直近30日以内の予定がここに表示されます</div>`;el.innerHTML=html;renderMemoCards('today');}

function renderDays(n){const tabKey=n+'days';const el=document.getElementById('list-'+tabKey+'-'+currentWS);if(!el)return;const iso=todayISO();const getRef=i=>i.date||i.dateStart||'';const future=new Date();future.setDate(future.getDate()+n);const futureISO=`${future.getFullYear()}-${pad(future.getMonth()+1)}-${pad(future.getDate())}`;const overdue=items.filter(i=>!i.done&&getRef(i)&&getRef(i)<iso).sort((a,b)=>getRef(a)<getRef(b)?1:-1);const inRange=items.filter(i=>!i.done&&getRef(i)>=iso&&getRef(i)<=futureISO).sort((a,b)=>getRef(a)<getRef(b)?-1:1);const total=overdue.length+inRange.length;function tCard(item){const c=getCatStyle(item.cat);const ref=getRef(item);const d=ref?daysUntil(ref):null;let bc='ok',bt=d===null?'':`あと${d}日`;if(d!==null){if(d<0){bc='overdue';bt=`超過${Math.abs(d)}日`;}else if(d===0){bc='urgent';bt='今日！';}else if(d<=7)bc='urgent';}return`<div class="t-card${item.done?' done':''}"><button class="t-check${item.done?' done':''}" onclick="toggleDone(${item.id})"><svg viewBox="0 0 9 9" fill="none"><path d="M1 4.5L3.5 7L8 2" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="t-body"><div class="t-title">${escH(item.title)}</div><div class="t-meta">${ref?`<span class="t-date">${fmtFull(ref)}</span>`:''} ${bt?`<span class="t-badge ${bc}">${bt}</span>`:''}<span class="t-cat" style="background:${c.bg};color:${c.color}">${escH(item.cat)}</span></div></div><div class="t-actions"><button class="t-act" onclick="openModal(${item.id})"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" width="12" height="12"><path d="M9.5 2.5l2 2L4 12H2v-2L9.5 2.5z"/></svg></button><button class="t-act del" onclick="confirmDelete(${item.id})"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" width="12" height="12"><path d="M2 4h10M5 4V2.5h4V4M5.5 6.5v4M8.5 6.5v4M3 4l.7 7.5h6.6L11 4"/></svg></button></div></div>`;}let html=`<div class="today-header"><span class="today- function downloadCSV(){const BOM='\uFEFF',hdr=['タイトル','カテゴリ','年','目標日','開始日','終了日','メモ','達成'];const rows=items.map(i=>['"'+(i.title||'').replace(/"/g,'""')+'"','"'+(i.cat||'')+'"',i.year,i.date||'',i.dateStart||'',i.dateEnd||'','"'+(i.note||'').replace(/"/g,'""')+'"',i.done?'済み':'未達成'].join(','));triggerDL('management_note.csv',BOM+hdr.join(',')+'\n'+rows.join('\n'),'text/csv;charset=utf-8');}
function downloadTXT(){const lines=['マネジメントノート 2026-2036','='.repeat(32),''];YEARS.forEach(y=>{const yi=items.filter(i=>i.year===y);if(!yi.length&&!memos[y])return;lines.push('【'+y+'年】');if(memos[y])lines.push('メモ：'+memos[y],'');yi.forEach(i=>{lines.push((i.done?'[達成] ':'[ ] ')+i.title);if(i.date)lines.push('  目標日：'+fmtFull(i.date));lines.push('  カテゴリ：'+i.cat);if(i.note)lines.push('  メモ：'+i.note);lines.push('');});});triggerDL('management_note.txt',lines.join('\n'),'text/plain;charset=utf-8');}
function importJSON(){const file=(document.getElementById('file-input').files||[])[0];const msg=document.getElementById('import-msg');if(!file){msg.textContent='ファイルを選択してください';return;}const reader=new FileReader();reader.onload=e=>{try{const data=JSON.parse(e.target.result);const imported=data.items||(Array.isArray(data)?data:null);if(!imported)throw new Error('形式が正しくありません');items=imported;memos=data.memos||{};customCats=data.customCats||[];saveData();msg.style.color='#3b6d11';msg.textContent=imported.length+'件を読み込みました';buildPanels();buildNav();setTab('today');}catch(err){msg.style.color='#a32d2d';msg.textContent='読み込みに失敗：'+err.message;}};reader.readAsText(file);}
</script>
